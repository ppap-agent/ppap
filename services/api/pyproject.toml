[project]
name = "ppap-api"
version = "0.1.0"
description = "PPAP Product API"
requires-python = "==3.12.*"
dependencies = [
    "ppap-application",
    "ppap-core",
    "ppap-product-store",
    "fastapi>=0.115.8",
    "uvicorn>=0.34.0",
    "starlette>=0.45.3",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "pydantic>=2.10.6",
]

[tool.uv.sources]
ppap-application = { workspace = true }
ppap-core = { workspace = true }
ppap-product-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppap_api"]
