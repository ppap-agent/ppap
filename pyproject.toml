[project]
name = "ppap"
version = "0.0.0"
description = "PPAP product"
requires-python = ">=3.12"
dependencies = [
    "api",
    "worker",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pyyaml==6.0.3",
    "corpus-contracts",
    "mcp-client",
    "ruff>=0.14.13,<0.15.0",
    "mypy>=1.7.1",
    "pre-commit>=4.7.0",
]
e2e = [
    "playwright",
    "pytest-xdist==3.8.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/product",
    "packages/agent",
    "packages/audit",
    "packages/documents",
    "apps/api",
    "apps/worker",
    "apps/mcp-client",
    "tests/corpus/contracts",
]

[tool.uv.sources]
product = { workspace = true }
agent = { workspace = true }
audit = { workspace = true }
documents = { workspace = true }
api = { workspace = true }
worker = { workspace = true }
corpus-contracts = { workspace = true }
mcp-client = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "live"]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

[tool.ruff]
line-length = 200
target-version = "py312"
required-version = ">=0.14.13,<0.15.0"
cache-dir = ".cache/ruff"
force-exclude = true
show-fixes = true
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
files = ["packages", "apps/api", "apps/worker", "apps/mcp-client", "tests/corpus/contracts/src"]
exclude = ["tests/(?!corpus/contracts/src)", "migrations/", "__pycache__/"]
mypy_path = [
    "packages/product/src",
    "tests/corpus/contracts/src",
    "packages/agent/src",
    "packages/audit/src",
    "packages/documents/src",
    "apps/api/src",
    "apps/worker/src",
    "apps/mcp-client/src",
]
