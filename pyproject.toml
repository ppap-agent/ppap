[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ppap"
version = "0.0.0"
description = "PPAP product"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "starlette==0.45.3",
    "psycopg[binary]==3.2.6",
    "boto3==1.36.16",
    "botocore==1.36.16",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "openai==1.95.0",
    "pandas==2.1.4",
    "openpyxl==3.1.2",
    "xlrd==1.2.0",
    "Pillow==10.1.0",
    "PyMuPDF==1.26.0",
    "opencv-python-headless==4.9.0.80",
    "numpy>=1.24.0",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "olefile>=0.47",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
]
e2e = [
    "playwright",
]

[tool.setuptools.packages.find]
namespaces = false
where = [
    "packages",
    "packages/ppap_docops/src",
    "packages/ppap_excel_audit_engine/src",
    "packages/ppap_ocr_adapter/src",
    "packages/ppap_pdf_to_excel/src",
    "packages/ppap_vision/src",
    "services/api",
    "services/worker",
]
include = [
    "ppap_core*",
    "ppap_docops*",
    "ppap_excel_audit_engine*",
    "ppap_ocr_adapter*",
    "ppap_pdf_to_excel*",
    "ppap_vision*",
    "ppap_api*",
    "ppap_worker*",
]
