[project]
name = "ppap"
version = "0.0.0"
description = "PPAP product"
requires-python = ">=3.12"
dependencies = [
    "ppap-api",
    "ppap-worker",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "ppap-corpus-contracts",
]
e2e = [
    "playwright",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/ppap_application",
    "packages/ppap_core",
    "packages/ppap_deep",
    "packages/ppap_docops",
    "packages/ppap_excel_audit_engine",
    "packages/ppap_ocr_adapter",
    "packages/ppap_pdf_to_excel",
    "packages/ppap_product_store",
    "packages/ppap_vision",
    "services/api",
    "services/worker",
    "packages/ppap_corpus_contracts",
]

[tool.uv.sources]
ppap-application = { workspace = true }
ppap-core = { workspace = true }
ppap-deep = { workspace = true }
ppap-docops = { workspace = true }
ppap-excel-audit-engine = { workspace = true }
ppap-ocr-adapter = { workspace = true }
ppap-pdf-to-excel = { workspace = true }
ppap-product-store = { workspace = true }
ppap-vision = { workspace = true }
ppap-api = { workspace = true }
ppap-worker = { workspace = true }
ppap-corpus-contracts = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
