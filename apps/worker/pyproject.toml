[project]
name = "worker"
version = "0.1.0"
description = "PPAP audit worker"
requires-python = "==3.12.*"
dependencies = [
    "product",
    "agent",
    "documents",
    "audit",
]

[tool.uv.sources]
product = { workspace = true }
agent = { workspace = true }
documents = { workspace = true }
audit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
