<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PPAP 审核文件</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body class="pc-app">
    <aside class="pc-shell" data-testid="pc-shell">
      <div class="pc-shell__brand">PPAP</div>
      <nav class="pc-shell__nav">
        <a data-nav="workbench" data-testid="nav-workbench" href="./">工作台</a>
        <a data-nav="audit-files" data-testid="nav-audit-files" href="./audit-files">审核文件</a>
        <a data-nav="usage" data-testid="nav-usage" href="./usage">用量记录</a>
        <a data-nav="rules" data-testid="nav-rules" href="./rules">审核规则</a>
      </nav>
      <p class="pc-shell__session">当前身份 <code data-testid="current-user" id="history-user">anonymous</code></p>
    </aside>
    <main class="pc-main">
      <header class="pc-page-head">
        <h1 data-testid="pc-page-title">审核文件</h1>
        <p class="pc-lead">回访历史轮次。每一轮固定当时的文件版本，新上传不会改写旧结果。</p>
      </header>
      <div class="pc-toolbar">
        <input data-testid="history-search" id="history-search" type="search" placeholder="搜索文件或规则" />
        <select data-testid="history-execution-filter" id="history-execution-filter">
          <option value="">全部执行状态</option>
          <option value="queued">queued</option>
          <option value="running">running</option>
          <option value="completed">completed</option>
          <option value="failed">failed</option>
        </select>
      </div>
      <p data-testid="history-error" id="history-error" class="error hidden"></p>
      <p data-testid="history-empty" id="history-empty" class="hidden">暂无审核记录</p>
      <table data-testid="history-list" id="history-list" class="hidden">
        <thead>
          <tr><th>文件</th><th>版本</th><th>规则</th><th>执行</th><th>结果</th><th>回访</th></tr>
        </thead>
        <tbody data-testid="history-rows" id="history-rows"></tbody>
      </table>
      <button id="history-more" hidden>加载更多</button>
    </main>
    <script src="./product-api.js"></script>
    <script src="./audit-files.js"></script>
    <script src="./shell.js"></script>
  </body>
</html>
