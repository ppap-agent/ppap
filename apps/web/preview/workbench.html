<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PPAP · 本地预览台</title>
  <style>
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #171717; background: #f5f5f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, select, input { font: inherit; }
    button, select, input[type="number"], a.action { min-height: 34px; border: 1px solid #d4d4d4; border-radius: 8px; background: #fff; color: inherit; }
    button, a.action { padding: 6px 11px; cursor: pointer; text-decoration: none; white-space: nowrap; }
    button:hover, a.action:hover { background: #f5f5f5; }
    button[aria-pressed="true"] { background: #171717; border-color: #171717; color: #fff; }
    button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    select { padding: 5px 28px 5px 9px; }
    input[type="number"] { width: 74px; padding: 5px 8px; }
    .shell { display: flex; flex-direction: column; min-height: 100dvh; }
    .top { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 12px 20px; }
    .heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 10px; }
    h1 { font-size: 17px; letter-spacing: -.02em; margin: 0; }
    .hint { margin: 0; color: #666; font-size: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .group { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; }
    #scenes[hidden] { display: none; }
    .label { color: #737373; font-size: 12px; margin-right: 3px; }
    .spacer { flex: 1; }
    .stage { display: flex; justify-content: safe center; flex: 1; min-height: 0; overflow-x: auto; padding: 20px; }
    .device { flex: 0 0 var(--frame-width); width: var(--frame-width); min-width: 280px; height: calc(100dvh - 145px); min-height: 560px; overflow: hidden; background: #fff; border: 1px solid #d4d4d4; border-radius: 12px; box-shadow: 0 8px 28px #0000000c; transition: width .18s ease; }
    .device.fluid { flex: 1; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    @media (max-width: 750px) { .top { padding: 12px; } .stage { padding: 8px; } .device { height: calc(100dvh - 205px); min-height: 500px; border-radius: 8px; } .spacer { display: none; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="heading"><h1>PPAP · 本地预览台</h1><p class="hint">概念原型与现有页面 · 模拟数据 · 不连接现网</p></div>
      <div class="toolbar" role="group" aria-label="预览设置">
        <label class="group"><span class="label">页面</span><select id="page" aria-label="页面">
          <option value="intake">统一审核旅程</option><option value="progress">检查进度演示</option><option value="concept">人工复核演示</option><option value="amendment">回件登记演示</option><option value="requirements">审核要求</option><option value="usage">用量记录</option>
        </select></label>
        <div id="scenes" class="group" role="group" aria-label="数据场景"><span class="label">场景</span><button data-scene="populated" type="button">有数据</button><button data-scene="empty" type="button">空状态</button><button data-scene="error" type="button">错误</button><button data-scene="long" type="button">长列表</button></div>
        <div class="group" role="group" aria-label="预览宽度"><span class="label">宽度</span><button data-width="390" type="button">手机</button><button data-width="820" type="button">平板</button><button data-width="1440" type="button">桌面</button><button data-width="fluid" type="button">自适应</button><input id="custom-width" type="number" min="280" max="2400" step="1" aria-label="自定义宽度（像素）" title="自定义宽度（像素）" /></div>
        <div class="spacer"></div>
        <button id="theme" type="button" aria-label="切换明暗主题">深色</button>
        <button id="refresh" type="button">刷新</button>
        <a id="standalone" class="action" target="_blank" rel="noopener noreferrer">独立打开 ↗</a>
      </div>
    </header>
    <main class="stage" aria-label="预览画布"><div id="device" class="device"><iframe id="product" title="PPAP 产品预览"></iframe></div></main>
  </div>
  <script>
    const paths = {concept: '/preview/concept.html', intake: '/preview/intake.html', progress: '/preview/intake.html?step=progress&variant=action&scenario=running', amendment: '/preview/concept.html?stage=response&variant=tasks', requirements: '/preview/intake.html?view=requirements', usage: '/preview/intake.html?view=usage'};
    const choices = {scene: ['populated', 'empty', 'error', 'long'], width: ['390', '820', '1440', 'fluid'], theme: ['light', 'dark']};
    const query = new URLSearchParams(location.search);
    const state = {page: paths[query.get('page')] ? query.get('page') : 'intake', scene: choices.scene.includes(query.get('scene')) ? query.get('scene') : 'populated', width: choices.width.includes(query.get('width')) ? query.get('width') : 'fluid', theme: choices.theme.includes(query.get('theme')) ? query.get('theme') : 'light'};
    const frame = document.getElementById('product');
    const device = document.getElementById('device');
    const custom = document.getElementById('custom-width');
    function render(reload) {
      document.cookie = `ppap_preview_scene=${state.scene}; Path=/; SameSite=Lax`;
      document.cookie = `ppap_preview_theme=${state.theme}; Path=/; SameSite=Lax`;
      document.getElementById('page').value = state.page;
      document.getElementById('scenes').hidden = state.page === 'concept' || state.page === 'intake' || state.page === 'progress' || state.page === 'amendment';
      for (const button of document.querySelectorAll('[data-scene]')) button.setAttribute('aria-pressed', String(button.dataset.scene === state.scene));
      for (const button of document.querySelectorAll('[data-width]')) button.setAttribute('aria-pressed', String(button.dataset.width === state.width));
      device.classList.toggle('fluid', state.width === 'fluid');
      device.style.setProperty('--frame-width', state.width === 'fluid' ? '100%' : `${state.width}px`);
      custom.value = state.width === 'fluid' ? '' : state.width;
      document.getElementById('theme').textContent = state.theme === 'light' ? '深色' : '浅色';
      const destination = paths[state.page];
      document.getElementById('standalone').href = destination;
      const current = new URLSearchParams(state);
      history.replaceState(null, '', `/__preview?${current}`);
      if (reload) frame.src = destination;
    }
    document.getElementById('page').addEventListener('change', event => { state.page = event.target.value; render(true); });
    for (const button of document.querySelectorAll('[data-scene]')) button.addEventListener('click', () => { state.scene = button.dataset.scene; render(true); });
    for (const button of document.querySelectorAll('[data-width]')) button.addEventListener('click', () => { state.width = button.dataset.width; render(false); });
    custom.addEventListener('change', () => { const width = Number(custom.value); if (Number.isFinite(width) && width >= 280 && width <= 2400) { state.width = String(width); render(false); } else render(false); });
    document.getElementById('theme').addEventListener('click', () => { state.theme = state.theme === 'light' ? 'dark' : 'light'; render(true); });
    document.getElementById('refresh').addEventListener('click', () => { frame.contentWindow.location.reload(); });
    frame.addEventListener('load', () => {
      const opened = new URL(frame.contentWindow.location.href);
      const path = opened.pathname;
      const actual = path === '/preview/concept.html' ? (opened.searchParams.get('stage') === 'response' ? 'amendment' : 'concept') : path === '/preview/intake.html' ? (['requirements', 'usage'].includes(opened.searchParams.get('view')) ? opened.searchParams.get('view') : opened.searchParams.get('step') === 'progress' ? 'progress' : 'intake') : null;
      if (actual && actual !== state.page) { state.page = actual; render(false); }
    });
    render(true);
  </script>
</body>
</html>
