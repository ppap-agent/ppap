<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PPAP · 本地预览台</title>
  <style>
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #171717; background: #f5f5f4; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, select, input { font: inherit; }
    button, select, input[type="number"], a.action { min-height: 34px; border: 1px solid #d4d4d4; border-radius: 8px; background: #fff; color: inherit; }
    button, a.action { padding: 6px 11px; cursor: pointer; text-decoration: none; white-space: nowrap; }
    button:hover, a.action:hover { background: #f5f5f5; }
    button[aria-pressed="true"] { background: #171717; border-color: #171717; color: #fff; }
    button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    select { padding: 5px 28px 5px 9px; }
    input[type="number"] { width: 74px; padding: 5px 8px; }
    .shell { display: flex; flex-direction: column; min-height: 100dvh; }
    .top { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 12px 20px; }
    .heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 10px; }
    h1 { font-size: 17px; letter-spacing: -.02em; margin: 0; }
    .hint { margin: 0; color: #666; font-size: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .group { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; }
    #scenes[hidden] { display: none; }
    .label { color: #737373; font-size: 12px; margin-right: 3px; }
    .spacer { flex: 1; }
    .stage { display: flex; justify-content: safe center; flex: 1; min-height: 0; overflow-x: auto; padding: 20px; }
    .device { flex: 0 0 var(--frame-width); width: var(--frame-width); min-width: 280px; height: calc(100dvh - 145px); min-height: 560px; overflow: hidden; background: #fff; border: 1px solid #d4d4d4; border-radius: 12px; box-shadow: 0 8px 28px #0000000c; transition: width .18s ease; }
    .device.fluid { flex: 1; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    @media (max-width: 750px) { .top { padding: 12px; } .stage { padding: 8px; } .device { height: calc(100dvh - 205px); min-height: 500px; border-radius: 8px; } .spacer { display: none; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="heading"><h1>PPAP · 本地预览台</h1><p class="hint">概念原型与现有页面 · 模拟数据 · 不连接现网</p></div>
      <div class="toolbar" role="group" aria-label="预览设置">
        <label class="group"><span class="label">页面</span><select id="page" aria-label="页面">
          <option value="audit">V3.1 上传与规则确认</option><option value="intake">统一审核旅程（原型）</option><option value="progress">检查进度演示</option><option value="concept">人工复核演示</option><option value="amendment">回件登记演示</option><option value="requirements">审核要求</option><option value="usage">用量记录</option>
        </select></label>
        <div id="scenes" class="group" role="group" aria-label="数据场景"><span class="label">场景（切换会重置）</span><button data-scene="populated" type="button">有数据</button><button data-scene="empty" type="button">空状态</button><button data-scene="error" type="button">错误</button><button data-scene="long" type="button">长列表</button><button data-scene="invalid" type="button">异常文件</button><button data-scene="partial" type="button">部分匹配</button><button data-scene="unmatched" type="button">零匹配</button><button data-scene="checking" type="button">预检查中</button><button data-scene="matching" type="button">识别中</button><button data-scene="drive-loading" type="button">飞书读取中</button><button data-scene="drive-error" type="button">飞书读取失败</button><button data-scene="drive-denied" type="button">飞书待授权</button><button data-scene="drive-empty" type="button">飞书空列表</button><button data-scene="confirm-loading" type="button">受理回执中</button><button data-scene="confirm-unknown" type="button">受理结果未知</button><button data-scene="audit-loading" type="button">审核结果读取中</button><button data-scene="summary-conflict" type="button">总结冲突</button><button data-scene="evidence-outside" type="button">证据越界</button><button data-scene="rule-conflict" type="button">条款冲突</button><button data-scene="failed-report-ready" type="button">报告资格冲突</button></div>
        <div id="recovery-scenes" class="group" role="group" aria-label="传输与恢复样例"><button data-scene="upload-partial" type="button">部分传输失败</button><button data-scene="upload-loading" type="button">传输中</button><button data-scene="restore-matching" type="button">恢复识别中</button><button data-scene="restore-pending" type="button">恢复待确认</button><button data-scene="restore-reviewing" type="button">恢复审核中</button><button data-scene="restore-completed" type="button">恢复已完成</button><button data-scene="restore-unknown" type="button">恢复受理未知</button><button data-scene="restore-loading" type="button">恢复读取中</button><button data-scene="restore-auth" type="button">恢复待登录</button><button data-scene="restore-denied" type="button">恢复无权</button><button data-scene="restore-missing" type="button">恢复不存在</button><button data-scene="restore-error" type="button">恢复离线</button></div>
        <div class="group" role="group" aria-label="预览宽度"><span class="label">宽度</span><button data-width="390" type="button">手机</button><button data-width="820" type="button">平板</button><button data-width="1440" type="button">桌面</button><button data-width="fluid" type="button">自适应</button><input id="custom-width" type="number" min="280" max="2400" step="1" aria-label="自定义宽度（像素）" title="自定义宽度（像素）" /></div>
        <div class="spacer"></div>
        <button id="theme" type="button" aria-label="切换明暗主题">深色</button>
        <button id="refresh" type="button">刷新</button>
        <button data-read="return" type="button">返回一次示例读取</button><button data-read="fail" type="button">令一次示例读取失败</button>
        <a id="standalone" class="action" target="_blank" rel="noopener noreferrer">独立打开 ↗</a>
      </div>
    </header>
    <main class="stage" aria-label="预览画布"><div id="device" class="device"><iframe id="product" title="PPAP 产品预览"></iframe></div></main>
  </div>
  <script>
    const paths = {audit: '/preview/audit.html', concept: '/preview/concept.html', intake: '/preview/intake.html', progress: '/preview/intake.html?step=progress&variant=action&scenario=running', amendment: '/preview/concept.html?stage=response&variant=tasks', requirements: '/preview/intake.html?view=requirements', usage: '/preview/intake.html?view=usage'};
    const choices = {scene: Array.from(document.querySelectorAll('[data-scene]'), button => button.dataset.scene), width: ['390', '820', '1440', 'fluid'], theme: ['light', 'dark']};
    const query = new URLSearchParams(location.search);
    const savedWidth = Number(query.get('width'));
    const state = {page: paths[query.get('page')] ? query.get('page') : 'audit', scene: choices.scene.includes(query.get('scene')) ? query.get('scene') : 'populated', width: Number.isInteger(savedWidth) && savedWidth >= 280 && savedWidth <= 2400 ? String(savedWidth) : 'fluid', theme: choices.theme.includes(query.get('theme')) ? query.get('theme') : 'light', task: query.get('task') || (query.get('scene')?.startsWith('restore-') ? 'preview-recovery-task' : '')};
    const frame = document.getElementById('product');
    const device = document.getElementById('device');
    const custom = document.getElementById('custom-width');
    function render(reload) {
      if (state.page !== 'audit') {
        document.cookie = `ppap_preview_scene=${state.scene}; Path=/; SameSite=Lax`;
        document.cookie = `ppap_preview_theme=${state.theme}; Path=/; SameSite=Lax`;
      }
      document.getElementById('page').value = state.page;
      document.getElementById('scenes').hidden = state.page === 'concept' || state.page === 'intake' || state.page === 'progress' || state.page === 'amendment';
      document.getElementById('recovery-scenes').hidden = state.page !== 'audit';
      for (const button of document.querySelectorAll('[data-scene]')) {
        button.setAttribute('aria-pressed', String(button.dataset.scene === state.scene));
        button.hidden = state.page === 'audit' ? ['empty', 'long'].includes(button.dataset.scene) : !['populated', 'empty', 'error', 'long'].includes(button.dataset.scene);
      }
      for (const button of document.querySelectorAll('[data-read]')) button.hidden = state.page !== 'audit' || !['matching', 'drive-loading', 'confirm-loading', 'audit-loading', 'upload-loading', 'restore-loading'].includes(state.scene);
      for (const button of document.querySelectorAll('[data-width]')) button.setAttribute('aria-pressed', String(button.dataset.width === state.width));
      device.classList.toggle('fluid', state.width === 'fluid');
      device.style.setProperty('--frame-width', state.width === 'fluid' ? '100%' : `${state.width}px`);
      custom.value = state.width === 'fluid' ? '' : state.width;
      document.getElementById('theme').textContent = state.theme === 'light' ? '深色' : '浅色';
      let destination = paths[state.page];
      if (state.page === 'audit') {
        const target = new URL(destination, location.origin);
        target.searchParams.set('scene', state.scene);
        target.searchParams.set('theme', state.theme);
        if (state.task) target.searchParams.set('task', state.task);
        destination = target.pathname + target.search;
        if (!reload && frame.contentDocument) {
          frame.contentDocument.documentElement.classList.toggle('dark', state.theme === 'dark');
          frame.contentWindow.history.replaceState(null, '', destination);
        }
      }
      document.getElementById('standalone').href = destination;
      const current = new URLSearchParams(state);
      history.replaceState(null, '', `/__preview?${current}`);
      if (reload) frame.src = destination;
    }
    document.getElementById('page').addEventListener('change', event => { state.page = event.target.value; render(true); });
    for (const button of document.querySelectorAll('[data-scene]')) button.addEventListener('click', () => { state.scene = button.dataset.scene; state.task = state.scene.startsWith('restore-') ? 'preview-recovery-task' : ''; render(true); });
    for (const button of document.querySelectorAll('[data-width]')) button.addEventListener('click', () => { state.width = button.dataset.width; render(false); });
    custom.addEventListener('change', () => { const width = Number(custom.value); if (Number.isFinite(width) && width >= 280 && width <= 2400) { state.width = String(width); render(false); } else render(false); });
    document.getElementById('theme').addEventListener('click', () => { state.theme = state.theme === 'light' ? 'dark' : 'light'; render(state.page !== 'audit'); });
    document.getElementById('refresh').addEventListener('click', () => { frame.contentWindow.location.reload(); });
    for (const button of document.querySelectorAll('[data-read]')) button.addEventListener('click', () => frame.contentWindow.postMessage({type: 'ppap-preview-read', failed: button.dataset.read === 'fail'}, location.origin));
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== frame.contentWindow || event.data?.type !== 'ppap-audit-task' || event.data.task !== null && (typeof event.data.task !== 'string' || event.data.task.length > 256)) return;
      state.task = event.data.task || ''; render(false);
    });
    frame.addEventListener('load', () => {
      const opened = new URL(frame.contentWindow.location.href);
      const path = opened.pathname;
      const actual = path === '/preview/audit.html' ? 'audit' : path === '/preview/concept.html' ? (opened.searchParams.get('stage') === 'response' ? 'amendment' : 'concept') : path === '/preview/intake.html' ? (['requirements', 'usage'].includes(opened.searchParams.get('view')) ? opened.searchParams.get('view') : opened.searchParams.get('step') === 'progress' ? 'progress' : 'intake') : null;
      if (actual && actual !== state.page) { state.page = actual; render(false); }
    });
    render(true);
  </script>
</body>
</html>
