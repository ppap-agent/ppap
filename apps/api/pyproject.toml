[project]
name = "api"
version = "0.1.0"
description = "PPAP Product API"
requires-python = "==3.12.*"
dependencies = [
    "product",
    "worker",
    "fastapi>=0.115.8",
    "uvicorn>=0.34.0",
    "starlette>=0.45.3",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "pydantic>=2.10.6",
    "Pillow>=10.1.0",
    "mcp>=1.26,<2",
    "fastmcp>=3,<4",
]

[tool.uv.sources]
product = { workspace = true }
worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
