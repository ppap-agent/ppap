[project]
name = "corpus-contracts"
version = "0.1.0"
description = "Corpus regression domain: human oracle, model replay, and reporting. Not a product API."
requires-python = "==3.12.*"
dependencies = [
    "product",
    "agent",
    "documents",
    "audit",
    "worker",
    "openpyxl>=3.1.2",
    "httpx>=0.28.1",
]

[tool.uv.sources]
product = { workspace = true }
agent = { workspace = true }
documents = { workspace = true }
audit = { workspace = true }
worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_contracts"]
