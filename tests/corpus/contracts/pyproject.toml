[project]
name = "corpus-contracts"
version = "0.1.0"
description = "Corpus regression domain: ExecutionOutcome, baselines, and oracle reconciliation. Not a product API."
requires-python = "==3.12.*"
dependencies = [
    "product",
    "documents",
    "audit",
    "pandas>=2.1.4",
    "httpx>=0.28.1",
]

[tool.uv.sources]
product = { workspace = true }
documents = { workspace = true }
audit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_contracts"]
