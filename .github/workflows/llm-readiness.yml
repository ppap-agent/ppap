name: LLM readiness

on:
  workflow_dispatch:
  # Weekly: catch provider/API/credential drift without running this probe on
  # every PR. Uses the same real secrets and Responses API as manual dispatch.
  schedule:
    - cron: "41 3 * * 3"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Probe Responses API
        env:
          PPAP_MODEL_TEXT_API_KEY: ${{ secrets.CI_LLM_API_KEY }}
          PPAP_MODEL_TEXT_BASE_URL: ${{ secrets.CI_LLM_BASE_URL }}
          PPAP_MODEL_TEXT_MODEL: ${{ secrets.CI_LLM_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PPAP_MODEL_TEXT_API_KEY:?missing PPAP_MODEL_TEXT_API_KEY}"
          : "${PPAP_MODEL_TEXT_BASE_URL:?missing PPAP_MODEL_TEXT_BASE_URL}"
          : "${PPAP_MODEL_TEXT_MODEL:?missing PPAP_MODEL_TEXT_MODEL}"
          PPAP_MODEL_TEXT_BASE_URL="$(printf '%s' "$PPAP_MODEL_TEXT_BASE_URL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PPAP_MODEL_TEXT_MODEL="$(printf '%s' "$PPAP_MODEL_TEXT_MODEL" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          response="$(mktemp)"
          events="$(mktemp)"
          trap 'rm -f "$response" "$events"' EXIT
          payload="$(jq -nc --arg model "$PPAP_MODEL_TEXT_MODEL" '{model:$model,store:false,stream:true,input:[{role:"user",content:[{type:"input_text",text:"Reply with exactly PPAP_READY."}]}]}')"
          http_status="$(curl --silent --show-error --connect-timeout 10 --max-time 60 --output "$response" --write-out '%{http_code}' -H "Authorization: Bearer $PPAP_MODEL_TEXT_API_KEY" -H "Content-Type: application/json" -H "Accept: text/event-stream" "${PPAP_MODEL_TEXT_BASE_URL%/}/responses" -d "$payload")"
          [[ "$http_status" =~ ^2[0-9][0-9]$ ]] || { echo "LLM Responses API: HTTP $http_status"; exit 1; }
          sed -n 's/^data: //p' "$response" | jq -Rr 'fromjson? | .type? // empty' > "$events"
          grep -qx 'response.completed' "$events" || { echo "LLM Responses API: completion event missing"; exit 1; }
          echo "LLM Responses API: ready"
