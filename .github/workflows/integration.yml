name: Product integration

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'services/**'
      - 'migrations/**'
      - 'deploy/**'
      - 'tests/integration/**'
      - 'tests/e2e/**'
      - 'docker-bake.hcl'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/actions/assert-docker/**'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'services/**'
      - 'migrations/**'
      - 'deploy/**'
      - 'tests/integration/**'
      - 'tests/e2e/**'
      - 'docker-bake.hcl'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/actions/assert-docker/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Product integration
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 80
    env:
      PPAP_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PPAP_COMPOSE_TEST: ppap-ci-product-tests-${{ github.run_id }}-${{ github.run_attempt }}
      PPAP_COMPOSE_PROD: ppap-ci-prod-${{ github.run_id }}-${{ github.run_attempt }}
      PPAP_COMPOSE_E2E: ppap-ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assert Docker
        uses: ./.github/actions/assert-docker
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install Python deps and browser
        run: |
          set -euo pipefail
          uv sync --locked --group e2e
          uv run --no-sync python -m playwright install chromium
      - name: Cross-owner product contracts
        env:
          COMPOSE_PROJECT_NAME: ${{ env.PPAP_COMPOSE_TEST }}
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml up -d postgres --wait --wait-timeout 120
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml run --rm init-db
          uv run --no-sync pytest tests/integration/product
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml down -v --remove-orphans
      - name: Bake canonical api, worker, and web images
        run: |
          set -euo pipefail
          docker buildx bake
          docker image inspect \
            "ppap-api:${PPAP_BUILD_SHA}" \
            "ppap-worker:${PPAP_BUILD_SHA}" \
            "ppap-web:${PPAP_BUILD_SHA}" \
            >/dev/null
          test "$(docker compose -f deploy/isolated-dev/compose.yaml config --images | grep -Fx "ppap-api:${PPAP_BUILD_SHA}" | wc -l)" -eq 1
          test "$(docker compose -f deploy/isolated-dev/compose.yaml config --images | grep -Fx "ppap-worker:${PPAP_BUILD_SHA}" | wc -l)" -eq 1
          test "$(docker compose -f deploy/isolated-dev/compose.yaml config --images | grep -Fx "ppap-web:${PPAP_BUILD_SHA}" | wc -l)" -eq 1
          test "$(docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example config --images | grep -Fx "ppap-api:${PPAP_BUILD_SHA}" | wc -l)" -eq 1
          test "$(docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example config --images | grep -Fx "ppap-worker:${PPAP_BUILD_SHA}" | wc -l)" -eq 1
          test "$(docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example config --images | grep -Fx "ppap-web:${PPAP_BUILD_SHA}" | wc -l)" -eq 1
      - name: Production runtime and backup
        env:
          COMPOSE_PROJECT_NAME: ${{ env.PPAP_COMPOSE_PROD }}
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/compose.yaml --env-file deploy/compose.env.example \
            up -d --wait --wait-timeout 180
          uv run --no-sync pytest tests/integration/runtime
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/compose.yaml --env-file deploy/compose.env.example \
            down -v --remove-orphans
      - name: Isolated-dev browser E2E
        env:
          COMPOSE_PROJECT_NAME: ${{ env.PPAP_COMPOSE_E2E }}
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            up -d --wait --wait-timeout 180 --no-build
          uv run --no-sync pytest tests/e2e
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans
      - name: Dump Compose diagnostics
        if: failure()
        run: |
          dump() {
            local project="$1"
            local file="$2"
            shift 2
            echo "=== ${project} ps ==="
            docker compose -p "$project" -f "$file" "$@" ps -a || true
            echo "=== ${project} logs ==="
            docker compose -p "$project" -f "$file" "$@" logs --no-color --timestamps \
              postgres silo init-db init-bucket api worker web || true
          }
          dump "$PPAP_COMPOSE_TEST" deploy/isolated-dev/compose.yaml
          dump "$PPAP_COMPOSE_PROD" deploy/compose.yaml --env-file deploy/compose.env.example
          dump "$PPAP_COMPOSE_E2E" deploy/isolated-dev/compose.yaml
      - name: Clean Compose stacks
        if: always()
        run: |
          docker compose -p "$PPAP_COMPOSE_TEST" -f deploy/isolated-dev/compose.yaml down -v --remove-orphans || true
          docker compose -p "$PPAP_COMPOSE_PROD" -f deploy/compose.yaml --env-file deploy/compose.env.example \
            down -v --remove-orphans || true
          docker compose -p "$PPAP_COMPOSE_E2E" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans || true
