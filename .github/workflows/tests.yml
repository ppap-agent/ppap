name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: packages:packages/ppap_docops/src:packages/ppap_excel_audit_engine/src:packages/ppap_ocr_adapter/src:packages/ppap_pdf_to_excel/src:packages/ppap_vision/src:services/api:services/worker

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check commit whitespace
        run: git show --format= --check HEAD -- . ':!assets' ':!tests/fixtures'
      - name: Run unit tests
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile tools/stack.py tools/web_server.py
          python -m unittest discover -s tests/unit -v

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql postgresql-contrib
      - name: Isolated-dev audit loop
        env:
          PYTHONPATH: packages:packages/ppap_docops/src:packages/ppap_excel_audit_engine/src:packages/ppap_ocr_adapter/src:packages/ppap_pdf_to_excel/src:packages/ppap_vision/src:services/api:services/worker
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tools/stack.py up
          python tools/stack.py verify-audit
          python -m unittest tests.e2e.test_web_audit
          python tools/stack.py down

  corpus:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: V2 4.8 excel
            extra: ""
            args: tests/corpus/v2_assets --ftype excel -q
          - name: V2 4.8 pdf
            extra: ""
            args: tests/corpus/v2_assets --ftype pdf -q
          - name: V2 4.8 scanned
            extra: ""
            args: tests/corpus/v2_assets --ftype scanned -q
          - name: V3 POC grouped
            extra: ""
            args: tests/corpus/v3_poc -q
          - name: PSW cross-format
            extra: libreoffice
            args: tests/corpus/test_psw_cross_format_regression.py tests/corpus/test_psw_cross_format_audit.py -q
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install corpus dependencies
        run: python -m pip install -r requirements.txt
      - name: Install LibreOffice and DOC sandbox
        if: matrix.extra == 'libreoffice'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libreoffice-writer gcc libc6-dev
          sudo gcc -O2 -Wall -Wextra -Werror \
            -o /usr/local/bin/ppap-local-converter-sandbox \
            packages/ppap_docops/native/legacy_doc_sandbox.c
          command -v soffice
          test -x /usr/local/bin/ppap-local-converter-sandbox
      - name: Run in-repo corpus pytest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          PADDLE_OCR_URL: ${{ secrets.PADDLE_OCR_URL }}
          PADDLE_TOKEN: ${{ secrets.PADDLE_TOKEN }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: python -m pytest ${{ matrix.args }}
