name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Canonical install, quality, unit tests, and build
        run: |
          python tools/dev.py install
          python tools/dev.py quality
          python tools/dev.py test
          python tools/dev.py build
          python -c "import json; ident=json.load(open('dist/identity.json')); assert ident['git_sha']; assert ident['web']=='dist/web'; assert ident['images']=={}"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Production images for this Git revision
        env:
          PPAP_BUILD_IMAGES: "1"
        run: |
          python tools/dev.py install
          python tools/dev.py build
          python -c "import json; ident=json.load(open('dist/identity.json')); print(json.dumps(ident, indent=2)); assert set(ident['images'])=={'api','worker','web'}; assert all(ident['git_sha'] in tag for tag in ident['images'].values())"
          python tools/dev.py deploy
          python tools/dev.py test deploy
          python tools/dev.py undeploy


  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql postgresql-contrib
      - name: Isolated-dev audit loop
        run: |
          python tools/dev.py install
          python -m pip install -e ".[e2e]"
          python -m playwright install --with-deps chromium
          python tools/stack.py up
          python tools/stack.py verify-audit
          python tools/dev.py test e2e
          python tools/stack.py down

  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql postgresql-contrib
      - name: Empty and previous schema upgrade
        run: |
          python tools/dev.py install
          python tools/stack.py migrate
          python tools/dev.py migrate
          python tools/dev.py test schema

  corpus:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: V2 4.8 excel
            extra: ""
            args: tests/corpus/v2_assets --ftype excel -q
          - name: V2 4.8 pdf
            extra: ""
            args: tests/corpus/v2_assets --ftype pdf -q
          - name: V2 4.8 scanned
            extra: ""
            args: tests/corpus/v2_assets --ftype scanned -q
          - name: V3 POC grouped
            extra: ""
            args: tests/corpus/v3_poc -q
          - name: PSW cross-format
            extra: libreoffice
            args: tests/corpus/test_psw_cross_format_regression.py tests/corpus/test_psw_cross_format_audit.py -q
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Canonical install
        run: python tools/dev.py install
      - name: Install LibreOffice and DOC sandbox
        if: matrix.extra == 'libreoffice'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libreoffice-writer gcc libc6-dev
          sudo gcc -O2 -Wall -Wextra -Werror \
            -o /usr/local/bin/ppap-local-converter-sandbox \
            packages/ppap_docops/native/legacy_doc_sandbox.c
          command -v soffice
          test -x /usr/local/bin/ppap-local-converter-sandbox
      - name: Run in-repo corpus pytest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          PADDLE_OCR_URL: ${{ secrets.PADDLE_OCR_URL }}
          PADDLE_TOKEN: ${{ secrets.PADDLE_TOKEN }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: python tools/dev.py test pytest ${{ matrix.args }}
