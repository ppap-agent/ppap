name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# push and pull_request for the same branch are different events. Keeping them
# in one group made the later run cancel the earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Toolchain authority is project metadata, not workflow literals:
#   Python deps: uv.lock via `uv sync --locked` and `uv run --no-sync`
#   Python interpreter: .python-version
#   Node: .node-version
#   pnpm: apps/web/package.json packageManager (Corepack)
# Third-party/official actions are pinned to an immutable commit SHA with the
# released tag in a trailing comment. Local composite actions use paths.

jobs:
  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use runner-local Corepack cache
        working-directory: ${{ github.workspace }}
        run: echo "COREPACK_HOME=$RUNNER_TEMP/corepack/${GITHUB_RUN_ID}/${GITHUB_JOB}" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Typecheck, test, lint, and production build
        working-directory: ${{ github.workspace }}/apps/web
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm build
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: ${{ github.workspace }}
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install preview browser dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          uv sync --locked --group e2e
          uv run --no-sync python -m playwright install chromium
      - name: V3.1 preview browser contracts
        working-directory: ${{ github.workspace }}/apps/web
        env:
          PPAP_PREVIEW: "1"
          # Set to "0" to restore the previous serial preview run.
          PPAP_PREVIEW_WORKERS: "2"
        run: |
          pnpm exec node --input-type=module <<'JS'
          import {spawn} from 'node:child_process'
          import {once} from 'node:events'
          import {readdirSync} from 'node:fs'
          import {resolve} from 'node:path'
          import {createServer} from 'vite'

          const root = resolve('../..'), directory = resolve(root, 'tests/e2e')
          const tests = readdirSync(directory).filter(name => /^test_.*_preview\.py$/.test(name)).sort().map(name => resolve(directory, name))
          if (!tests.length) throw new Error('No preview browser contracts found')
          const server = await createServer({server: {host: '127.0.0.1', strictPort: false}})
          try {
            await server.listen()
            const address = server.httpServer?.address()
            if (!address || typeof address === 'string' || address.address !== '127.0.0.1') throw new Error('Preview did not bind to loopback')
            const preview = `http://127.0.0.1:${address.port}`
            console.log(`UI-only preview: ${preview}`)
            // Fail closed on typos and keep a one-line serial rollback switch.
            const workers = process.env.PPAP_PREVIEW_WORKERS ?? '0'
            if (!['0', '2'].includes(workers)) throw new Error('PPAP_PREVIEW_WORKERS must be 0 or 2')
            const pytestArgs = ['run', '--no-sync', 'pytest', ...(workers === '2' ? ['-n', '2', '--dist=load'] : []), '--durations=25', ...tests]
            console.log(`Preview pytest workers: ${workers}; test files: ${tests.length}`)
            const child = spawn('uv', pytestArgs, {cwd: root, stdio: 'inherit', env: {...process.env, PPAP_PREVIEW_URL: preview}})
            // Browser tests can be silent for minutes. Keep CI runner
            // heartbeat activity without changing test exit semantics.
            const heartbeat = setInterval(() => console.log(`Preview heartbeat: child pid=${child.pid}`), 30000)
            try {
              const [code] = await once(child, 'exit')
              process.exitCode = code ?? 1
            } finally {
              clearInterval(heartbeat)
            }
          } finally {
            await server.close()
          }
          JS

  repository:
    name: Repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use runner-local Corepack cache
        working-directory: ${{ github.workspace }}
        run: echo "COREPACK_HOME=$RUNNER_TEMP/corepack/${GITHUB_RUN_ID}/${GITHUB_JOB}" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: ${{ github.workspace }}
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Assert Docker
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci_assert_docker.sh
      - name: Repository, config, and tooling contracts
        working-directory: ${{ github.workspace }}
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          set -euo pipefail
          uv sync --locked
          corepack enable
          # Corepack reads packageManager from the current directory, not from pnpm --dir.
          (
            cd apps/web
            pnpm install --frozen-lockfile
          )
          git show --format= --check HEAD -- . ':!assets' ':!tests/corpus/fixtures'
          uv run --no-sync python -m compileall -q packages apps/api apps/worker apps/mcp-client tests scripts
          uv run --no-sync ruff check packages apps/api apps/worker apps/mcp-client tests scripts
          if ! uv run --no-sync ruff format --check packages apps/api apps/worker apps/mcp-client tests scripts; then
            uv run --no-sync ruff format --diff packages apps/api apps/worker apps/mcp-client tests scripts
            exit 1
          fi
          uv run --no-sync mypy --no-incremental
          (
            cd apps/web
            pnpm api-types
          )
          git diff --exit-code -- apps/web/src/generated/openapi.ts
          node deploy/insforge/verify-config.mjs
          docker compose -f deploy/isolated-dev/compose.yaml config --quiet >/dev/null
          docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example config --quiet >/dev/null
          docker buildx bake --print >/dev/null
          docker buildx bake --check
          node scripts/verify-container-graph.mjs
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz" | sha256sum -c
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
          deploy/tke/render-current.sh \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.28.0 -
          python3 -m scripts.ci_shards plan
          uv run --no-sync python -m pytest tests/repository

  # Each shard discovers targets from the checked-out tree. Individual modules
  # keep their own pytest process; distribution runs retain isolated wheel venvs.
  distribution_closure:
    name: Distribution closure / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert Docker
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci_assert_docker.sh
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: ${{ github.workspace }}
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build, install and test isolated distributions
        working-directory: ${{ github.workspace }}
        run: python3 -m scripts.ci_shards distributions --shard "${{ matrix.shard }}"

  python_modules:
    name: Python modules / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert Docker
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci_assert_docker.sh
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: ${{ github.workspace }}
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Canonical install
        working-directory: ${{ github.workspace }}
        run: uv sync --locked
      - name: Run complete Python owner tests
        working-directory: ${{ github.workspace }}
        run: python3 -m scripts.ci_shards modules --shard "${{ matrix.shard }}"

  schema:
    name: Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ppap-ci-schema-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert Docker
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci_assert_docker.sh
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: ${{ github.workspace }}
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Schema PostgreSQL contracts
        working-directory: ${{ github.workspace }}
        env:
          PPAP_TEST_POSTGRES_PORT: "0"
        run: |
          set -euo pipefail
          uv sync --locked
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            up -d postgres --wait --wait-timeout 120
          binding=$(docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml port postgres 5432)
          export PGPORT="${binding##*:}"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            run --rm init-db
          uv run --no-sync pytest tests/schema
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans
      - name: Dump Compose diagnostics
        working-directory: ${{ github.workspace }}
        if: failure()
        run: |
          echo "=== ${COMPOSE_PROJECT_NAME} ps ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml ps -a || true
          echo "=== ${COMPOSE_PROJECT_NAME} logs ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            logs --no-color --timestamps postgres init-db || true
      - name: Clean Compose stack
        working-directory: ${{ github.workspace }}
        if: always()
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans || true

  corpus:
    name: Corpus / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # 0: serial complete PDF corpus; 2: all PDF items in one xdist pool.
      PPAP_CORPUS_PDF_WORKERS: "2"
      OPENAI_REASONING_EFFORT: low
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Excel
            mode: pytest
            args: tests/corpus/v2_assets --ftype excel -q
          - name: PDF
            mode: pytest
            args: tests/corpus/v2_assets --ftype pdf -q
          - name: scanned
            mode: pytest
            args: tests/corpus/v2_assets --ftype scanned -q
          - name: Pairs
            mode: pytest
            args: tests/corpus/pairs --cross-format -q
          - name: V3
            mode: pytest
            args: tests/corpus/v3_poc -q
          - name: PSW
            mode: psw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        if: ${{ matrix.mode == 'pytest' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: ${{ github.workspace }}
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Canonical install
        working-directory: ${{ github.workspace }}
        if: ${{ matrix.mode == 'pytest' }}
        run: |
          set -euo pipefail
          case "$PPAP_CORPUS_PDF_WORKERS" in 0|2) ;; *) echo "PPAP_CORPUS_PDF_WORKERS must be 0 or 2" >&2; exit 2 ;; esac
          if [[ "${{ matrix.name }}" == "PDF" && "$PPAP_CORPUS_PDF_WORKERS" == "2" ]]; then
            # xdist is pinned in e2e; browser binaries are not installed here.
            uv sync --locked --group e2e
          else
            uv sync --locked
          fi
      - name: Run in-repo corpus pytest
        working-directory: ${{ github.workspace }}
        if: ${{ matrix.mode == 'pytest' }}
        env:
          OPENAI_API_KEY: ${{ secrets.CI_LLM_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.CI_LLM_BASE_URL }}
          MODEL_NAME: ${{ secrets.CI_LLM_MODEL }}
          PADDLE_OCR_URL: ${{ secrets.PADDLE_OCR_URL }}
          PADDLE_TOKEN: ${{ secrets.PADDLE_TOKEN }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.name }}" == "PDF" && "$PPAP_CORPUS_PDF_WORKERS" == "2" ]]; then
            # One real xdist pool for all PDF corpus items, including the slow
            # test_v2_assets cases. Per-worker writable extraction caches are isolated.
            python3 -m scripts.ci_heartbeat --timeout 2400 -- \
              uv run --no-sync pytest tests/corpus/v2_assets --ftype pdf -q -n 2 \
                --dist=load --max-worker-restart=0 --durations=25 -vv -o faulthandler_timeout=120 --junitxml=ci-report/junit.xml
          else
            python3 -m scripts.ci_heartbeat --timeout 1800 -- \
              uv run --no-sync pytest ${{ matrix.args }} --durations=25 -vv -o faulthandler_timeout=120 --junitxml=ci-report/junit.xml
          fi
      - name: Assert Docker
        working-directory: ${{ github.workspace }}
        if: ${{ matrix.mode == 'psw' }}
        run: bash scripts/ci_assert_docker.sh
      - name: Run PSW corpus in purpose-built test image
        working-directory: ${{ github.workspace }}
        if: ${{ matrix.mode == 'psw' }}
        env:
          PPAP_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OPENAI_API_KEY: ${{ secrets.CI_LLM_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.CI_LLM_BASE_URL }}
          MODEL_NAME: ${{ secrets.CI_LLM_MODEL }}
          PADDLE_OCR_URL: ${{ secrets.PADDLE_OCR_URL }}
          PADDLE_TOKEN: ${{ secrets.PADDLE_TOKEN }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: |
          set -euo pipefail
          docker buildx bake worker
          docker build \
            --build-arg PPAP_WORKER_IMAGE="ppap-worker:${PPAP_BUILD_SHA}" \
            --build-context psw-tests=tests \
            --build-context psw-assets="assets/V2.0测试/模拟测试文件V2-01/16-零件提交保证书" \
            -f tests/corpus/Dockerfile.psw \
            -t "ppap-psw-test:${PPAP_BUILD_SHA}" \
            .
          mkdir -p ci-report
          python3 -m scripts.ci_heartbeat --timeout 1800 -- docker run --rm \
            -v "$PWD/ci-report:/ci-report" \
            -e OPENAI_API_KEY \
            -e OPENAI_BASE_URL \
            -e MODEL_NAME \
            -e OPENAI_REASONING_EFFORT \
            -e PADDLE_OCR_URL \
            -e PADDLE_TOKEN \
            -e OCR_OPENAI_API_KEY \
            -e OCR_OPENAI_BASE_URL \
            -e OCR_MODEL_NAME \
            "ppap-psw-test:${PPAP_BUILD_SHA}" \
            pytest tests/corpus/psw -vv --durations=25 -o faulthandler_timeout=120 --junitxml=/ci-report/junit.xml

      - name: Upload corpus failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-report/
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Product integration
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PPAP_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENAI_REASONING_EFFORT: low
      PPAP_COMPOSE_TEST: ppap-ci-product-tests-${{ github.run_id }}-${{ github.run_attempt }}
      PPAP_COMPOSE_PROD: ppap-ci-prod-${{ github.run_id }}-${{ github.run_attempt }}
      PPAP_COMPOSE_E2E: ppap-ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert Docker
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci_assert_docker.sh
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: ${{ github.workspace }}
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Use runner-local Corepack cache
        working-directory: ${{ github.workspace }}
        run: echo "COREPACK_HOME=$RUNNER_TEMP/corepack/${GITHUB_RUN_ID}/${GITHUB_JOB}" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install frontend dependencies for feedback E2E
        working-directory: ${{ github.workspace }}/apps/web
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Install Python deps and browser
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          uv sync --locked --group e2e
          uv run --no-sync python -m playwright install chromium
      - name: Cross-owner product contracts
        working-directory: ${{ github.workspace }}
        env:
          COMPOSE_PROJECT_NAME: ${{ env.PPAP_COMPOSE_TEST }}
          PPAP_TEST_POSTGRES_PORT: "0"
          OPENAI_API_KEY: ${{ secrets.CI_LLM_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.CI_LLM_BASE_URL }}
          MODEL_NAME: ${{ secrets.CI_LLM_MODEL }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml up -d postgres --wait --wait-timeout 120
          binding=$(docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml port postgres 5432)
          export PGPORT="${binding##*:}"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml run --rm init-db
          # Keep the long DB suite visible to the runner and cap its lifetime.
          python3 -m scripts.ci_heartbeat --timeout 2400 -- \
            uv run --no-sync pytest tests/integration/product -vv --durations=25 -o faulthandler_timeout=120 --junitxml=ci-report/product.xml
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml down -v --remove-orphans
      - name: Bake canonical api, worker, and web images
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          docker buildx bake
          docker image inspect \
            "ppap-api:${PPAP_BUILD_SHA}" \
            "ppap-worker:${PPAP_BUILD_SHA}" \
            "ppap-web:${PPAP_BUILD_SHA}" \
            >/dev/null
          test "$(docker compose -f deploy/isolated-dev/compose.yaml config --images | grep -Fxc "ppap-api:${PPAP_BUILD_SHA}")" -eq 1
          test "$(docker compose -f deploy/isolated-dev/compose.yaml config --images | grep -Fxc "ppap-worker:${PPAP_BUILD_SHA}")" -eq 1
          test "$(docker compose -f deploy/isolated-dev/compose.yaml config --images | grep -Fxc "ppap-web:${PPAP_BUILD_SHA}")" -eq 1
          test "$(docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example config --images | grep -Fxc "ppap-api:${PPAP_BUILD_SHA}")" -eq 1
          test "$(docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example config --images | grep -Fxc "ppap-worker:${PPAP_BUILD_SHA}")" -eq 1
          test "$(docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example config --images | grep -Fxc "ppap-web:${PPAP_BUILD_SHA}")" -eq 1
      - name: Production runtime and backup
        working-directory: ${{ github.workspace }}
        env:
          COMPOSE_PROJECT_NAME: ${{ env.PPAP_COMPOSE_PROD }}
        run: |
          set -euo pipefail
          bash scripts/run-compose-tests.sh tests/integration/runtime \
            -p "$COMPOSE_PROJECT_NAME" -f deploy/compose.yaml --env-file deploy/compose.env.example
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/compose.yaml --env-file deploy/compose.env.example \
            down -v --remove-orphans
      - name: Isolated-dev browser E2E
        working-directory: ${{ github.workspace }}
        env:
          COMPOSE_PROJECT_NAME: ${{ env.PPAP_COMPOSE_E2E }}
          # Intentional all-suite concurrency experiment on isolated-dev.
          # Includes real API/PostgreSQL/Worker E2E to surface state races.
          # "0" restores serial execution of exactly the same full test set.
          PPAP_E2E_WORKERS: "4"
        run: |
          set -euo pipefail
          # The always() cleanup step owns teardown. No duplicate Compose down
          # may obscure a successful browser test result.
          bash scripts/run-compose-tests.sh tests/e2e \
            -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml
      - name: Dump Compose diagnostics
        working-directory: ${{ github.workspace }}
        if: failure()
        run: |
          dump() {
            local project="$1"
            local file="$2"
            shift 2
            echo "=== ${project} ps ==="
            docker compose -p "$project" -f "$file" "$@" ps -a || true
            echo "=== ${project} logs ==="
            docker compose -p "$project" -f "$file" "$@" logs --no-color --timestamps \
              postgres silo init-db init-bucket api worker web || true
          }
          dump "$PPAP_COMPOSE_TEST" deploy/isolated-dev/compose.yaml
          dump "$PPAP_COMPOSE_PROD" deploy/compose.yaml --env-file deploy/compose.env.example
          dump "$PPAP_COMPOSE_E2E" deploy/isolated-dev/compose.yaml
      - name: Clean Compose stacks
        working-directory: ${{ github.workspace }}
        if: always()
        run: |
          # Attempt every stack even after one cleanup error. Never mask failure.
          set +e
          failed=0
          docker compose -p "$PPAP_COMPOSE_TEST" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans || failed=1
          docker compose -p "$PPAP_COMPOSE_PROD" -f deploy/compose.yaml --env-file deploy/compose.env.example \
            down -v --remove-orphans || failed=1
          docker compose -p "$PPAP_COMPOSE_E2E" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans || failed=1
          exit "$failed"

      - name: Upload integration failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-report/
          if-no-files-found: ignore
          retention-days: 7

  ci_gate:
    name: CI Gate
    if: ${{ !cancelled() }}
    needs:
      - web
      - repository
      - python_modules
      - distribution_closure
      - schema
      - corpus
      - integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require merge contract jobs to succeed
        env:
          WEB_RESULT: ${{ needs.web.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          PYTHON_MODULES_RESULT: ${{ needs.python_modules.result }}
          DISTRIBUTION_CLOSURE_RESULT: ${{ needs.distribution_closure.result }}
          SCHEMA_RESULT: ${{ needs.schema.result }}
          CORPUS_RESULT: ${{ needs.corpus.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "$WEB_RESULT" \
            "$REPOSITORY_RESULT" \
            "$PYTHON_MODULES_RESULT" \
            "$DISTRIBUTION_CLOSURE_RESULT" \
            "$SCHEMA_RESULT" \
            "$CORPUS_RESULT" \
            "$INTEGRATION_RESULT"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            printf 'required results: web=%s repository=%s python_modules=%s distribution_closure=%s schema=%s corpus=%s integration=%s\n' \
              "$WEB_RESULT" "$REPOSITORY_RESULT" "$PYTHON_MODULES_RESULT" "$DISTRIBUTION_CLOSURE_RESULT" "$SCHEMA_RESULT" "$CORPUS_RESULT" "$INTEGRATION_RESULT"
            exit 1
          fi
