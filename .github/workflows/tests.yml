name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Set up Python
        run: |
          set -euo pipefail
          uv python install 3.12
          rm -rf .venv
          uv venv --python 3.12 --seed .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Install, quality, and unit tests
        run: |
          uv pip install -e ".[dev]"
          git show --format= --check HEAD -- . ':!assets' ':!tests/fixtures'
          python -m compileall -q packages services tests
          python -m unittest discover -s tests/unit -v

  build:
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure Docker
        uses: ./.github/actions/ensure-docker
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Set up Python
        run: |
          set -euo pipefail
          uv python install 3.12
          rm -rf .venv
          uv venv --python 3.12 --seed .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Bake images, compose up, runtime and backup checks
        env:
          PPAP_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          uv pip install -e ".[dev]"
          docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example down -v --remove-orphans || true
          docker compose -f deploy/isolated-dev/compose.yaml down -v --remove-orphans || true
          docker buildx bake
          docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example up -d --wait --wait-timeout 180
          python -m unittest tests.deploy.test_runtime tests.deploy.test_backup -v
          docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example down -v --remove-orphans

  e2e:
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure Docker
        uses: ./.github/actions/ensure-docker
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Set up Python
        run: |
          set -euo pipefail
          uv python install 3.12
          rm -rf .venv
          uv venv --python 3.12 --seed .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Isolated-dev compose and browser loop
        env:
          PPAP_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          uv pip install -e ".[dev,e2e]"
          python -m playwright install chromium
          docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example down -v --remove-orphans || true
          docker compose -f deploy/isolated-dev/compose.yaml down -v --remove-orphans || true
          docker buildx bake
          docker compose -f deploy/isolated-dev/compose.yaml up -d --wait --wait-timeout 180
          python -m unittest tests.e2e.test_web_audit -v
          docker compose -f deploy/isolated-dev/compose.yaml down -v --remove-orphans

  schema:
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure Docker
        uses: ./.github/actions/ensure-docker
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Set up Python
        run: |
          set -euo pipefail
          uv python install 3.12
          rm -rf .venv
          uv venv --python 3.12 --seed .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Empty and previous schema upgrade
        run: |
          set -euo pipefail
          uv pip install -e ".[dev]"
          export PGHOST=127.0.0.1
          export PGPORT=5432
          export PGUSER=ppap
          export PGPASSWORD=ppap_isolated_dev
          export PPAP_PG_DATABASE=ppap
          export PPAP_PG_MIGRATOR_USER=ppap_migrator
          export PPAP_PG_MIGRATOR_PASSWORD=ppap_isolated_dev
          export PPAP_PG_API_USER=ppap_api
          export PPAP_PG_API_PASSWORD=ppap_isolated_dev
          export PPAP_PG_WORKER_USER=ppap_worker
          export PPAP_PG_WORKER_PASSWORD=ppap_isolated_dev
          docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example down -v --remove-orphans || true
          docker compose -f deploy/isolated-dev/compose.yaml down -v --remove-orphans || true
          docker compose -f deploy/isolated-dev/compose.yaml up -d postgres init-db --wait --wait-timeout 120
          python -m unittest tests.schema.test_upgrade -v
          docker compose -f deploy/isolated-dev/compose.yaml down -v --remove-orphans

  corpus:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: V2 4.8 excel
            extra: ""
            args: tests/corpus/v2_assets --ftype excel -q
          - name: V2 4.8 pdf
            extra: ""
            args: tests/corpus/v2_assets --ftype pdf -q
          - name: V2 4.8 scanned
            extra: ""
            args: tests/corpus/v2_assets --ftype scanned -q
          - name: V3 POC grouped
            extra: ""
            args: tests/corpus/v3_poc -q
          - name: PSW cross-format
            extra: libreoffice
            args: tests/corpus/test_psw_cross_format_regression.py tests/corpus/test_psw_cross_format_audit.py -q
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Set up Python
        run: |
          set -euo pipefail
          uv python install 3.12
          rm -rf .venv
          uv venv --python 3.12 --seed .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Canonical install
        run: uv pip install -e ".[dev]"
      - name: Install LibreOffice and DOC sandbox
        if: matrix.extra == 'libreoffice'
        run: |
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"
          if ! command -v soffice >/dev/null; then
            for attempt in 1 2 3 4 5; do
              if sudo apt-get -o Acquire::Retries=5 update \
                && sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends libreoffice-writer gcc libc6-dev; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "apt could not install libreoffice-writer" >&2
                exit 1
              fi
              sleep $((attempt * 4))
            done
          elif ! command -v gcc >/dev/null; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends gcc libc6-dev
          fi
          sudo gcc -O2 -Wall -Wextra -Werror \
            -o /usr/local/bin/ppap-local-converter-sandbox \
            packages/ppap_docops/native/legacy_doc_sandbox.c
          command -v soffice
          test -x /usr/local/bin/ppap-local-converter-sandbox
      - name: Run in-repo corpus pytest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          PADDLE_OCR_URL: ${{ secrets.PADDLE_OCR_URL }}
          PADDLE_TOKEN: ${{ secrets.PADDLE_TOKEN }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: uv run pytest ${{ matrix.args }}
