name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# push and pull_request for the same branch are different events. Keeping them
# in one group made the later run cancel the earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Toolchain authority is project metadata, not workflow literals:
#   Python deps: uv.lock via `uv sync --locked` and `uv run --no-sync`
#   Python interpreter: .python-version
#   Node: .node-version
#   pnpm: apps/web/package.json packageManager (Corepack)
# Third-party/official actions are pinned to an immutable commit SHA with the
# released tag in a trailing comment. Local composite actions use paths.

jobs:
  web:
    name: Web contract
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Typecheck, test, lint, and production build
        working-directory: apps/web
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm build

  insforge-config:
    name: InsForge config
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Verify PPAP-owned InsForge contract
        run: node deploy/insforge/verify-config.mjs

  test:
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install, quality, and unit tests
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          git show --format= --check HEAD -- . ':!assets' ':!tests/fixtures'
          uv run --no-sync python -m compileall -q packages services tests
          uv run --no-sync python -m unittest discover -s packages/ppap_core/tests -v
          uv run --no-sync python -m unittest discover -s packages/ppap_deep/tests -v
          uv run --no-sync python -m unittest discover -s packages/ppap_excel_audit_engine/tests -v
          uv run --no-sync python -m unittest discover -s packages/ppap_ocr_adapter/tests -v
          uv run --no-sync python -m unittest discover -s tests/repository -v

  integration:
    name: Docker integration
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 80
    env:
      PPAP_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PPAP_COMPOSE_TEST: ppap-ci-product-tests-${{ github.run_id }}-${{ github.run_attempt }}
      PPAP_COMPOSE_PROD: ppap-ci-prod-${{ github.run_id }}-${{ github.run_attempt }}
      PPAP_COMPOSE_E2E: ppap-ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assert Docker
        uses: ./.github/actions/assert-docker
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install Python deps and browser
        run: |
          set -euo pipefail
          uv sync --locked --extra dev --extra e2e
          uv run --no-sync python -m playwright install chromium
      - name: Product store-backed contracts
        env:
          COMPOSE_PROJECT_NAME: ${{ env.PPAP_COMPOSE_TEST }}
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml             up -d postgres --wait --wait-timeout 120
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml             run --rm init-db
          uv run --no-sync python -m unittest discover -s services/api/tests -v
          uv run --no-sync python -m unittest discover -s services/worker/tests -v
          uv run --no-sync python -m unittest discover -s tests/integration -v
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml             down -v --remove-orphans
      - name: Bake api, worker, and web images
        run: |
          set -euo pipefail
          docker buildx bake
          docker image inspect \
            "ppap-api:${PPAP_BUILD_SHA}" \
            "ppap-worker:${PPAP_BUILD_SHA}" \
            "ppap-web:${PPAP_BUILD_SHA}" \
            >/dev/null
      - name: Production runtime and backup
        env:
          COMPOSE_PROJECT_NAME: ${{ env.PPAP_COMPOSE_PROD }}
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/compose.yaml --env-file deploy/compose.env.example \
            up -d --wait --wait-timeout 180
          uv run --no-sync python -m unittest tests.deploy.test_runtime tests.deploy.test_backup -v
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/compose.yaml --env-file deploy/compose.env.example \
            down -v --remove-orphans
      - name: Isolated-dev browser E2E
        env:
          COMPOSE_PROJECT_NAME: ${{ env.PPAP_COMPOSE_E2E }}
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            up -d --wait --wait-timeout 180 --no-build
          uv run --no-sync python -m unittest tests.e2e.test_web_audit tests.e2e.test_ui_a11y tests.e2e.test_rules tests.e2e.test_rule_interactions -v
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans
      - name: Dump Compose diagnostics
        if: failure()
        run: |
          dump() {
            local project="$1"
            local file="$2"
            shift 2
            echo "=== ${project} ps ==="
            docker compose -p "$project" -f "$file" "$@" ps -a || true
            echo "=== ${project} logs ==="
            docker compose -p "$project" -f "$file" "$@" logs --no-color --timestamps \
              postgres silo init-db init-bucket api worker web || true
          }
          dump "$PPAP_COMPOSE_TEST" deploy/isolated-dev/compose.yaml
          dump "$PPAP_COMPOSE_PROD" deploy/compose.yaml --env-file deploy/compose.env.example
          dump "$PPAP_COMPOSE_E2E" deploy/isolated-dev/compose.yaml
      - name: Clean Compose stacks
        if: always()
        run: |
          docker compose -p "$PPAP_COMPOSE_PROD" -f deploy/compose.yaml --env-file deploy/compose.env.example \
            down -v --remove-orphans || true
          docker compose -p "$PPAP_COMPOSE_E2E" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans || true

  schema:
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ppap-ci-schema-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assert Docker
        uses: ./.github/actions/assert-docker
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Schema PostgreSQL contracts
        run: |
          set -euo pipefail
          uv sync --locked --extra dev
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            up -d postgres --wait --wait-timeout 120
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            run --rm init-db
          uv run --no-sync python -m unittest discover -s tests/schema -v
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans
      - name: Dump Compose diagnostics
        if: failure()
        run: |
          echo "=== ${COMPOSE_PROJECT_NAME} ps ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml ps -a || true
          echo "=== ${COMPOSE_PROJECT_NAME} logs ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            logs --no-color --timestamps postgres init-db || true
      - name: Clean Compose stack
        if: always()
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans || true

  corpus:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: V2 4.8 excel
            args: tests/corpus/v2_assets --ftype excel -q
          - name: V2 4.8 pdf
            args: tests/corpus/v2_assets --ftype pdf -q
          - name: V2 4.8 scanned
            args: tests/corpus/v2_assets --ftype scanned -q
          - name: V3 POC grouped
            args: tests/corpus/v3_poc -q
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Canonical install
        run: uv sync --locked --extra dev
      - name: Run in-repo corpus pytest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          PADDLE_OCR_URL: ${{ secrets.PADDLE_OCR_URL }}
          PADDLE_TOKEN: ${{ secrets.PADDLE_TOKEN }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: uv run --no-sync pytest ${{ matrix.args }}

  psw:
    name: PSW cross-format
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assert Docker
        uses: ./.github/actions/assert-docker
      - name: Run PSW corpus in purpose-built test image
        env:
          PPAP_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          PADDLE_OCR_URL: ${{ secrets.PADDLE_OCR_URL }}
          PADDLE_TOKEN: ${{ secrets.PADDLE_TOKEN }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: |
          set -euo pipefail
          docker buildx bake worker
          docker build \
            --build-arg PPAP_WORKER_IMAGE="ppap-worker:${PPAP_BUILD_SHA}" \
            --build-context psw-tests=tests \
            --build-context psw-assets="assets/V2.0测试/模拟测试文件V2-01/16-零件提交保证书" \
            -f tests/corpus/Dockerfile.psw \
            -t "ppap-psw-test:${PPAP_BUILD_SHA}" \
            .
          docker run --rm \
            -e OPENAI_API_KEY \
            -e OPENAI_BASE_URL \
            -e MODEL_NAME \
            -e PADDLE_OCR_URL \
            -e PADDLE_TOKEN \
            -e OCR_OPENAI_API_KEY \
            -e OCR_OPENAI_BASE_URL \
            -e OCR_MODEL_NAME \
            "ppap-psw-test:${PPAP_BUILD_SHA}" \
            python -m pytest tests/corpus/test_psw_cross_format_regression.py tests/corpus/test_psw_cross_format_audit.py -q
