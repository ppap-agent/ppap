name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# push and pull_request for the same branch are different events. Keeping them
# in one group made the later run cancel the earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web contract
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck, test, lint, and production build
        working-directory: apps/web
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm build

  insforge-config:
    name: InsForge config
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify PPAP-owned InsForge contract
        run: node deploy/insforge/verify-config.mjs

  test:
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Set up Python
        run: |
          set -euo pipefail
          uv python install 3.12
          rm -rf .venv
          uv venv --python 3.12 --seed .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Install, quality, and unit tests
        run: |
          uv pip install -e ".[dev]"
          git show --format= --check HEAD -- . ':!assets' ':!tests/fixtures'
          python -m compileall -q packages services tests
          python -m unittest discover -s tests/unit -v

  build:
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure Docker
        uses: ./.github/actions/ensure-docker
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Set up Python
        run: |
          set -euo pipefail
          uv python install 3.12
          rm -rf .venv
          uv venv --python 3.12 --seed .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Bake images, compose up, runtime and backup checks
        env:
          PPAP_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          uv pip install -e ".[dev]"
          compose() { docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example "$@"; }
          dump() { compose ps -a || true; compose logs --no-color --timestamps postgres silo init-db init-bucket api worker web || true; }
          compose down -v --remove-orphans || true
          docker compose -f deploy/isolated-dev/compose.yaml down -v --remove-orphans || true
          docker buildx bake
          if ! compose up -d --wait --wait-timeout 180; then
            dump
            compose down -v --remove-orphans || true
            exit 1
          fi
          python -m unittest tests.deploy.test_runtime tests.deploy.test_backup -v
          compose down -v --remove-orphans

  e2e:
    name: Web browser E2E
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure Docker
        uses: ./.github/actions/ensure-docker
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Set up Python
        run: |
          set -euo pipefail
          uv python install 3.12
          rm -rf .venv
          uv venv --python 3.12 --seed .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Isolated-dev compose and browser loop
        env:
          PPAP_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          uv pip install -e ".[dev,e2e]"
          python -m playwright install chromium
          compose() { docker compose -f deploy/isolated-dev/compose.yaml "$@"; }
          dump() { compose ps -a || true; compose logs --no-color --timestamps postgres silo init-db init-bucket api worker web || true; }
          docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example down -v --remove-orphans || true
          compose down -v --remove-orphans || true
          docker buildx bake
          if ! compose up -d --wait --wait-timeout 180; then
            dump
            compose down -v --remove-orphans || true
            exit 1
          fi
          python -m unittest tests.e2e.test_web_audit tests.e2e.test_ui_a11y tests.e2e.test_rules tests.e2e.test_rule_interactions -v
          compose down -v --remove-orphans

  schema:
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure Docker
        uses: ./.github/actions/ensure-docker
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Set up Python
        run: |
          set -euo pipefail
          uv python install 3.12
          rm -rf .venv
          uv venv --python 3.12 --seed .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Empty and previous schema upgrade
        run: |
          set -euo pipefail
          uv pip install -e ".[dev]"
          compose() { docker compose -f deploy/isolated-dev/compose.yaml "$@"; }
          dump() { compose ps -a || true; compose logs --no-color --timestamps postgres init-db || true; }
          docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example down -v --remove-orphans || true
          compose down -v --remove-orphans || true
          if ! compose up -d postgres --wait --wait-timeout 120; then
            dump
            exit 1
          fi
          if ! compose run --rm init-db; then
            dump
            exit 1
          fi
          python -m unittest tests.schema.test_upgrade -v
          compose down -v --remove-orphans

  corpus:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: V2 4.8 excel
            args: tests/corpus/v2_assets --ftype excel -q
          - name: V2 4.8 pdf
            args: tests/corpus/v2_assets --ftype pdf -q
          - name: V2 4.8 scanned
            args: tests/corpus/v2_assets --ftype scanned -q
          - name: V3 POC grouped
            args: tests/corpus/v3_poc -q
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Set up Python
        run: |
          set -euo pipefail
          uv python install 3.12
          rm -rf .venv
          uv venv --python 3.12 --seed .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Canonical install
        run: uv pip install -e ".[dev]"
      - name: Run in-repo corpus pytest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          PADDLE_OCR_URL: ${{ secrets.PADDLE_OCR_URL }}
          PADDLE_TOKEN: ${{ secrets.PADDLE_TOKEN }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: uv run pytest ${{ matrix.args }}

  psw:
    name: PSW cross-format
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure Docker
        uses: ./.github/actions/ensure-docker
      - name: Run PSW corpus in worker image
        env:
          PPAP_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          PADDLE_OCR_URL: ${{ secrets.PADDLE_OCR_URL }}
          PADDLE_TOKEN: ${{ secrets.PADDLE_TOKEN }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: |
          set -euo pipefail
          docker buildx bake worker
          docker run --rm \
            --entrypoint sh \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e OPENAI_API_KEY \
            -e OPENAI_BASE_URL \
            -e MODEL_NAME \
            -e PADDLE_OCR_URL \
            -e PADDLE_TOKEN \
            -e OCR_OPENAI_API_KEY \
            -e OCR_OPENAI_BASE_URL \
            -e OCR_MODEL_NAME \
            "ppap-worker:${PPAP_BUILD_SHA}" \
            -c 'set -eu
                unset PYTHONPATH
                command -v soffice
                command -v ppap-local-converter-sandbox
                python -m pip install --no-cache-dir pytest==7.4.3 pytest-asyncio==0.21.1
                python -m pytest tests/corpus/test_psw_cross_format_regression.py tests/corpus/test_psw_cross_format_audit.py -q'
