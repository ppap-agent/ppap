name: Corpus live model evaluation

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: Complete corpus passes against the live model
        default: "3"

permissions:
  contents: read

jobs:
  evaluate:
    name: Live model evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PPAP_MODEL_TEXT_REASONING_EFFORT: low
      PPAP_CORPUS_MODEL: live
      PPAP_MODEL_VISION_EXTRA_BODY_JSON: '{"reasoning":{"effort":"none"}}'
      ROUNDS: ${{ inputs.rounds || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          working-directory: ${{ github.workspace }}
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python deps
        working-directory: ${{ github.workspace }}
        run: uv sync --locked --group e2e
      - name: Install shared Excel converter
        uses: ./.github/actions/excel-converter
      - name: Run every oracle case against the live model
        working-directory: ${{ github.workspace }}
        env:
          PPAP_MODEL_TEXT_API_KEY: ${{ secrets.CI_LLM_API_KEY }}
          PPAP_MODEL_TEXT_BASE_URL: ${{ secrets.CI_LLM_BASE_URL }}
          PPAP_MODEL_TEXT_MODEL: ${{ secrets.CI_LLM_MODEL }}
          PPAP_MODEL_VISION_API_KEY: ${{ secrets.PPAP_MODEL_VISION_API_KEY }}
          PPAP_MODEL_VISION_BASE_URL: ${{ secrets.PPAP_MODEL_VISION_BASE_URL }}
          PPAP_MODEL_VISION_MODEL: ${{ secrets.PPAP_MODEL_VISION_MODEL }}
        run: |
          set -uo pipefail
          [[ "$ROUNDS" =~ ^[1-9][0-9]*$ ]] || { echo "rounds must be a positive integer" >&2; exit 2; }
          failed=0
          # Every requested pass runs once. A later pass never erases a failure.
          for round in $(seq 1 "$ROUNDS"); do
            export PPAP_CORPUS_REPORT_DIR="ci-report/round-$round/rules"
            if ! python3 -m scripts.ci_heartbeat --timeout 3000 -- \
              uv run --no-sync pytest tests/corpus/test_cases.py -q -n 4 --dist=load --max-worker-restart=0; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Report differences from the human truth
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          [[ "$ROUNDS" =~ ^[1-9][0-9]*$ ]] || { echo "rounds must be a positive integer" >&2; exit 2; }
          results=()
          for round in $(seq 1 "$ROUNDS"); do
            results+=(--results "ci-report/round-$round/rules")
          done
          uv run --no-sync python -m scripts.corpus_report "${results[@]}" --require-complete --output ci-report/corpus-report.md
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ci-report/
          if-no-files-found: ignore
          retention-days: 30
