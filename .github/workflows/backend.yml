name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'services/**'
      - 'migrations/**'
      - 'tests/schema/**'
      - 'tests/corpus/**'
      - 'assets/**'
      - 'deploy/app/**'
      - 'deploy/deep/**'
      - 'deploy/isolated-dev/**'
      - 'docker-bake.hcl'
      - 'scripts/validate_distribution.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/actions/assert-docker/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'services/**'
      - 'migrations/**'
      - 'tests/schema/**'
      - 'tests/corpus/**'
      - 'assets/**'
      - 'deploy/app/**'
      - 'deploy/deep/**'
      - 'deploy/isolated-dev/**'
      - 'docker-bake.hcl'
      - 'scripts/validate_distribution.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/actions/assert-docker/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover_python_owners:
    name: Discover Python owners
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: discover
        name: Find owner test directories
        run: |
          set -euo pipefail
          matrix="$(python3 - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for base in (Path("packages"), Path("services")):
              for tests in sorted(base.glob("*/tests")):
                  if not any(tests.rglob("test_*.py")):
                      continue
                  owner = tests.parent.name
                  rows.append({
                      "id": owner.replace("_", "-"),
                      "name": owner,
                      "path": tests.as_posix(),
                      "postgres": base.name == "services",
                  })
          if not rows:
              raise SystemExit("no owner test directories")
          print(json.dumps(rows))
          PY
          )"
          {
            echo "matrix<<EOF"
            echo "$matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  discover_distributions:
    name: Discover distributions
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: discover
        name: Find production distributions
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/validate_distribution.py --discover)"
          {
            echo "matrix<<EOF"
            echo "$matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  distribution_closure:
    name: Distribution closure / ${{ matrix.name }}
    needs: discover_distributions
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: ppap-ci-dist-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover_distributions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assert Docker
        if: ${{ matrix.postgres }}
        uses: ./.github/actions/assert-docker
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Start service PostgreSQL fixture
        if: ${{ matrix.postgres }}
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml up -d postgres --wait --wait-timeout 120
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml run --rm init-db
      - name: Build, install, import, and test clean distribution closure
        run: python3 scripts/validate_distribution.py --member "${{ matrix.name }}"
      - name: Prove missing dependency fails closed
        if: ${{ matrix.name == 'ppap-product-store' }}
        run: python3 scripts/validate_distribution.py --prove-missing-dependency
      - name: Dump PostgreSQL diagnostics
        if: failure() && matrix.postgres
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml ps -a || true
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            logs --no-color --timestamps postgres init-db || true
      - name: Clean PostgreSQL fixture
        if: always() && matrix.postgres
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans || true

  python_modules:
    name: Python modules / ${{ matrix.name }}
    needs: discover_python_owners
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: ppap-ci-modules-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover_python_owners.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assert Docker
        if: ${{ matrix.postgres }}
        uses: ./.github/actions/assert-docker
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Canonical install
        run: uv sync --locked
      - name: Start service PostgreSQL fixture
        if: ${{ matrix.postgres }}
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml up -d postgres --wait --wait-timeout 120
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml run --rm init-db
      - name: Run module tests
        run: uv run --no-sync pytest ${{ matrix.path }}
      - name: Dump PostgreSQL diagnostics
        if: failure() && matrix.postgres
        run: |
          echo "=== ${COMPOSE_PROJECT_NAME} ps ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml ps -a || true
          echo "=== ${COMPOSE_PROJECT_NAME} logs ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            logs --no-color --timestamps postgres init-db || true
      - name: Clean PostgreSQL fixture
        if: always() && matrix.postgres
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans || true

  schema:
    name: Schema
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ppap-ci-schema-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assert Docker
        uses: ./.github/actions/assert-docker
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Schema PostgreSQL contracts
        run: |
          set -euo pipefail
          uv sync --locked
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            up -d postgres --wait --wait-timeout 120
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            run --rm init-db
          uv run --no-sync pytest tests/schema
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans
      - name: Dump Compose diagnostics
        if: failure()
        run: |
          echo "=== ${COMPOSE_PROJECT_NAME} ps ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml ps -a || true
          echo "=== ${COMPOSE_PROJECT_NAME} logs ==="
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            logs --no-color --timestamps postgres init-db || true
      - name: Clean Compose stack
        if: always()
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f deploy/isolated-dev/compose.yaml \
            down -v --remove-orphans || true

  corpus:
    name: Corpus / ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Excel
            mode: pytest
            args: tests/corpus/v2_assets --ftype excel -q
          - name: PDF
            mode: pytest
            args: tests/corpus/v2_assets --ftype pdf -q
          - name: scanned
            mode: pytest
            args: tests/corpus/v2_assets --ftype scanned -q
          - name: Pairs
            mode: pytest
            args: tests/corpus/pairs --cross-format -q
          - name: V3
            mode: pytest
            args: tests/corpus/v3_poc -q
          - name: PSW
            mode: psw
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        if: ${{ matrix.mode == 'pytest' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Canonical install
        if: ${{ matrix.mode == 'pytest' }}
        run: uv sync --locked
      - name: Run in-repo corpus pytest
        if: ${{ matrix.mode == 'pytest' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          PADDLE_OCR_URL: ${{ secrets.PADDLE_OCR_URL }}
          PADDLE_TOKEN: ${{ secrets.PADDLE_TOKEN }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: uv run --no-sync pytest ${{ matrix.args }}
      - name: Assert Docker
        if: ${{ matrix.mode == 'psw' }}
        uses: ./.github/actions/assert-docker
      - name: Run PSW corpus in purpose-built test image
        if: ${{ matrix.mode == 'psw' }}
        env:
          PPAP_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          PADDLE_OCR_URL: ${{ secrets.PADDLE_OCR_URL }}
          PADDLE_TOKEN: ${{ secrets.PADDLE_TOKEN }}
          OCR_OPENAI_API_KEY: ${{ secrets.OCR_OPENAI_API_KEY }}
          OCR_OPENAI_BASE_URL: ${{ secrets.OCR_OPENAI_BASE_URL }}
          OCR_MODEL_NAME: ${{ secrets.OCR_MODEL_NAME }}
        run: |
          set -euo pipefail
          docker buildx bake worker
          docker build \
            --build-arg PPAP_WORKER_IMAGE="ppap-worker:${PPAP_BUILD_SHA}" \
            --build-context psw-tests=tests \
            --build-context psw-assets="assets/V2.0测试/模拟测试文件V2-01/16-零件提交保证书" \
            -f tests/corpus/Dockerfile.psw \
            -t "ppap-psw-test:${PPAP_BUILD_SHA}" \
            .
          docker run --rm \
            -e OPENAI_API_KEY \
            -e OPENAI_BASE_URL \
            -e MODEL_NAME \
            -e PADDLE_OCR_URL \
            -e PADDLE_TOKEN \
            -e OCR_OPENAI_API_KEY \
            -e OCR_OPENAI_BASE_URL \
            -e OCR_MODEL_NAME \
            "ppap-psw-test:${PPAP_BUILD_SHA}" \
            pytest tests/corpus/psw -q
