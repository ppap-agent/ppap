name: InsForge lifecycle

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Native CLI smoke
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure Docker
        uses: ./.github/actions/ensure-docker
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Local start, status, db query, stop
        run: |
          set -euo pipefail
          bash deploy/insforge/smoke-local.sh
