name: InsForge lifecycle

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Native CLI smoke
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assert Docker
        uses: ./.github/actions/assert-docker
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Local start, status, db query, stop
        run: |
          set -euo pipefail
          bash deploy/insforge/smoke-local.sh
