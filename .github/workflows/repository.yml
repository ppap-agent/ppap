name: Repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: Repository contract
    runs-on: [self-hosted, linux, x64, ppap]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Assert Docker
        uses: ./.github/actions/assert-docker
      - name: Repository, config, and tooling contracts
        run: |
          set -euo pipefail
          uv sync --locked
          corepack enable
          pnpm --dir apps/web install --frozen-lockfile
          git show --format= --check HEAD -- . ':!assets' ':!tests/corpus/fixtures'
          uv run --no-sync python -m compileall -q packages services tests scripts
          pnpm --dir apps/web api-types
          git diff --exit-code -- apps/web/src/generated/openapi.ts
          node deploy/insforge/verify-config.mjs
          docker compose -f deploy/isolated-dev/compose.yaml config --quiet >/dev/null
          docker compose -f deploy/compose.yaml --env-file deploy/compose.env.example config --quiet >/dev/null
          docker buildx bake --print >/dev/null
          docker buildx bake --check
          node scripts/verify-container-graph.mjs
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz" | sha256sum -c
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
          deploy/tke/render-current.sh \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.28.0 -
          uv run --no-sync pytest tests/repository
