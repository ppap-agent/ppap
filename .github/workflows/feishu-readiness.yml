name: Feishu readiness

on:
  workflow_dispatch:
  # Weekly: catch Feishu app credential / Open API drift without running this
  # probe on every PR. Uses the same real secrets and endpoint as dispatch.
  schedule:
    - cron: "13 4 * * 4"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Probe store app credentials
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FEISHU_APP_ID:?missing FEISHU_APP_ID}"
          : "${FEISHU_APP_SECRET:?missing FEISHU_APP_SECRET}"
          FEISHU_APP_ID="$(printf '%s' "$FEISHU_APP_ID" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          http_status="$(curl --silent --show-error --connect-timeout 10 --max-time 60 --output "$response" --write-out '%{http_code}' -H "Content-Type: application/json" https://open.feishu.cn/open-apis/auth/v3/app_ticket/resend -d "$(jq -nc --arg app_id "$FEISHU_APP_ID" --arg app_secret "$FEISHU_APP_SECRET" '{app_id:$app_id,app_secret:$app_secret}')")"
          [[ "$http_status" =~ ^2[0-9][0-9]$ ]] || { echo "Feishu app credential probe: HTTP $http_status"; exit 1; }
          jq -e '.code == 0' "$response" >/dev/null || { jq -c '{code:(.code // null),msg:(.msg // null)}' "$response" 2>/dev/null || true; exit 1; }
          echo "Feishu store app credentials: ready"
