name: Feishu readiness

on:
  workflow_call:
    secrets:
      FEISHU_APP_ID:
        required: true
      FEISHU_APP_SECRET:
        required: true
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Probe app credentials
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FEISHU_APP_ID:?missing FEISHU_APP_ID}"
          : "${FEISHU_APP_SECRET:?missing FEISHU_APP_SECRET}"

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          curl --fail --silent --show-error             --connect-timeout 10             --max-time 60             -o "$response"             -H "Content-Type: application/json"             https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal             -d "$(jq -nc               --arg app_id "$FEISHU_APP_ID"               --arg app_secret "$FEISHU_APP_SECRET"               '{app_id:$app_id,app_secret:$app_secret}')"

          jq -e '
            .code == 0
            and (.tenant_access_token | type == "string" and length > 0)
            and (.expire | type == "number" and . > 0)
          ' "$response" >/dev/null

          echo "Feishu app credentials: ready"
