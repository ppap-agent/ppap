name: Legacy dependency preflight (not product acceptance)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legacy-preflight.yml
  workflow_dispatch:
    inputs:
      version_url:
        description: Read-only version endpoint for the migration dependency
        type: string
        default: https://ppap.api.xixifusi.online/version
      expected_build:
        description: Expected legacy Git SHA; historical default is not a claim about current deployment
        type: string
        default: 53a5bd2b00adaf7332602bbdbe3cfa82817ebbb9
permissions:
  contents: read
jobs:
  dependency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERSION_URL: ${{ inputs.version_url || 'https://ppap.api.xixifusi.online/version' }}
      EXPECTED_BUILD: ${{ inputs.expected_build || '53a5bd2b00adaf7332602bbdbe3cfa82817ebbb9' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute one read-only dependency proof
        run: python tools/live.py probe --url "$VERSION_URL" --expected-build "$EXPECTED_BUILD" --output-dir .artifacts/legacy-preflight
      - name: Preserve bounded evidence even on failure
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          reports = sorted(Path('.artifacts/legacy-preflight').glob('*.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Dependency only, not PPAP product acceptance\n')
              if not reports:
                  summary.write('NOT_PROVEN: no runner report was produced.\n')
              for path in reports:
                  report = json.loads(path.read_text())
                  text = json.dumps(report, ensure_ascii=False, indent=2)
                  print(text)
                  summary.write('\n```json\n' + text + '\n```\n')
