name: Install shared Excel converter
description: LibreOffice Calc, CJK fonts, and the local converter sandbox, with the packages cached between runs.
runs:
  using: composite
  steps:
    - name: Restore converter packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/excel-converter-debs
        key: excel-converter-debs-${{ runner.os }}-${{ runner.arch }}-v1
    - name: Install converter
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        debs="$HOME/.cache/excel-converter-debs"
        mkdir -p "$debs"
        # A stale or partial cache only costs the normal apt install below.
        if ! { compgen -G "$debs/*.deb" >/dev/null && sudo dpkg -i "$debs"/*.deb && command -v soffice >/dev/null; }; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc fonts-noto-cjk
          cp /var/cache/apt/archives/*.deb "$debs"/ 2>/dev/null || true
        fi
        cc -O2 -Wall -Wextra -Werror packages/documents/native/legacy_doc_sandbox.c \
          -o "$RUNNER_TEMP/ppap-local-converter-sandbox"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
