[project]
name = "ppap-mcp-client"
version = "0.1.0"
description = "Local PPAP MCP bridge with authorized streaming file transfer"
requires-python = "==3.12.*"
dependencies = [
    "fastmcp>=3.4,<3.5",
    "mcp>=1.30,<2",
    "httpx>=0.28,<1",
    "anyio>=4,<5",
    "filelock>=3.20,<4",
    "keyring>=25,<26",
    "cryptography>=43",
    "py-key-value-aio[filetree]>=0.4,<0.5",
    "platformdirs>=4,<5",
]

[project.scripts]
ppap-mcp-client = "ppap_mcp_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppap_mcp_client"]
