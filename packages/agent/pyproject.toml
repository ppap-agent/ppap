[project]
name = "agent"
version = "0.1.0"
description = "Understand documents, build audit instances, and run the bounded execution loop."
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.10.6",
    "audit",
    "documents",
]

[tool.uv.sources]
audit = { workspace = true }
documents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
