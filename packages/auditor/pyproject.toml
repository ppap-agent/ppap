[project]
name = "auditor"
version = "0.1.0"
description = "A model audits clauses against originals with reading tools only. No check programs."
requires-python = "==3.12.*"
dependencies = [
    "openpyxl>=3.1.2",
    "xlrd>=1.2.0",
    "Pillow>=10.2.0",
    "PyMuPDF>=1.26.0",
    "python-docx>=1.1.0",
    "httpx>=0.24.0",
]

[project.scripts]
look = "auditor.tools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditor"]
