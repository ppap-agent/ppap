[project]
name = "documents"
version = "0.1.0"
description = "Physical document reads, locations, and local presentation. No audit judgment."
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.10.6",
    "pandas>=2.1.4",
    "openpyxl>=3.1.2",
    "xlrd>=1.2.0",
    "Pillow>=10.2.0",
    "PyMuPDF>=1.26.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "olefile>=0.47",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0,<2",
    "pydantic-ai-slim[openai]==2.62.0",
    # The OpenAI SDK's HTTP client package; documents.ai constructs its client.
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documents"]
