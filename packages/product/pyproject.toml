[project]
name = "product"
version = "0.1.0"
description = "Product state: files, rules, rounds, reviews, and persistence."
requires-python = "==3.12.*"
dependencies = [
    "cryptography>=45.0.0",
    "httpx>=0.28.1",
    "botocore>=1.36.16",
    "boto3>=1.36.16",
    "pydantic-settings>=2.12.0",
    "pydantic>=2.10.6",
    "audit",
    "psycopg[binary]>=3.2.6",
]

[tool.uv.sources]
audit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product"]
