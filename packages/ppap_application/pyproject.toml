[project]
name = "ppap-application"
version = "0.1.0"
description = "PPAP application orchestration and composition boundaries."
requires-python = "==3.12.*"
dependencies = [
    "ppap-core",
    "ppap-docops",
    "ppap-excel-audit-engine",
    "ppap-product-store",
]

[tool.uv.sources]
ppap-core = { workspace = true }
ppap-docops = { workspace = true }
ppap-excel-audit-engine = { workspace = true }
ppap-product-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppap_application"]
