[project]
name = "ppap-product-store"
version = "0.1.0"
description = "Shared PPAP product persistence implementation."
requires-python = "==3.12.*"
dependencies = [
    "ppap-core",
    "psycopg[binary]>=3.2.6",
]

[tool.uv.sources]
ppap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppap_product_store"]
