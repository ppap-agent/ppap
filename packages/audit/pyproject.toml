[project]
name = "audit"
version = "0.1.0"
description = "Audit kernel: rules, logical documents, evidence, evaluator, and handwritten checkers."
requires-python = "==3.12.*"
dependencies = [
    "pydantic-settings>=2.12.0",
    "pydantic>=2.10.6",
    "documents",
    "openai",
    "pandas",
    "openpyxl",
    "Pillow>=10.2.0",
]

[tool.uv.sources]
documents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]
