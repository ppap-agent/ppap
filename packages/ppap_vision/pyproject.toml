[project]
name = "ppap-vision"
version = "0.1.0"
description = "PPAP Vision - image processing, seal and signature detection"
requires-python = "==3.12.*"
dependencies = [
    "ppap-core",
    "Pillow>=10.2.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.24.0",
    "PyMuPDF>=1.26.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
]

[tool.uv.sources]
ppap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppap_vision"]
