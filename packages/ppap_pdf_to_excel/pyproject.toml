[project]
name = "ppap-pdf-to-excel"
version = "0.1.0"
description = "PPAP PDF to Excel: geometry extraction and validated vision fallback"
requires-python = "==3.12.*"
dependencies = [
    "ppap-core",
    "ppap-docops",
    "openai>=1.95.0",
    "openpyxl>=3.1.2",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0,<2",
    "pymupdf>=1.26.0",
    "requests>=2.31.0",
]

[tool.uv.sources]
ppap-core = { workspace = true }
ppap-docops = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppap_pdf_to_excel"]
