[project]
name = "ppap-docops"
version = "0.1.0"
description = "PPAP Document Operations - extractors, converters, file utilities"
requires-python = "==3.12.*"
dependencies = [
    "ppap-core",
    "pandas>=2.1.4",
    "openpyxl>=3.1.2",
    "xlrd>=1.2.0",
    "Pillow>=10.1.0",
    "PyMuPDF>=1.26.0",
    "httpx>=0.24.0",
    "requests>=2.31.0",
    "olefile>=0.47",
]

[project.optional-dependencies]
# Runtime ownership: ../../ppap_agent/docs/dependency-runtime-ownership.md
ingestion = [
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
]

[tool.uv.sources]
ppap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppap_docops"]
