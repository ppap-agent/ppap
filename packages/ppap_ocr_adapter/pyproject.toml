[project]
name = "ppap-ocr-adapter"
version = "0.1.0"
description = "PPAP OCR Adapter - pluggable OCR providers and artifacts"
requires-python = "==3.12.*"
dependencies = [
    "openai>=1.95.0",
    "pillow>=10.1.0",
    "ppap-core",
    "ppap-docops",
    "openpyxl>=3.1.2",
    "pandas>=2.1.4",
    "pymupdf>=1.26.0",
    "requests>=2.31.0",
]

[tool.uv.sources]
ppap-core = { workspace = true }
ppap-docops = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppap_ocr_adapter"]
