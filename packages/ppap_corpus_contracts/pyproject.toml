[project]
name = "ppap-corpus-contracts"
version = "0.1.0"
description = "Corpus regression domain: ExecutionOutcome, baselines, and oracle reconciliation. Not a product API."
requires-python = "==3.12.*"
dependencies = [
    "ppap-core",
    "ppap-docops",
    "ppap-excel-audit-engine",
    "pandas>=2.1.4",
    "httpx>=0.28.1",
]

[tool.uv.sources]
ppap-core = { workspace = true }
ppap-docops = { workspace = true }
ppap-excel-audit-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppap_corpus_contracts"]
