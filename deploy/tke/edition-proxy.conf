map $cookie_ppap_edition $ppap_edition {
    current current;
    default legacy;
}

map $http_upgrade $office_connection {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;
    underscores_in_headers on;

    # ONLYOFFICE's virtual-path proxy contract. Never route this by edition cookie.
    location /office/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $office_connection;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host/office;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://ppap-current-office/;
        proxy_read_timeout 1000s;
        proxy_send_timeout 1000s;
        proxy_buffering off;
    }

    location = /enter-current {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass http://ppap-current-api:8080/enter-current;
        proxy_read_timeout 30s;
    }

    location = /enter-legacy {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass http://ppap-current-api:8080/enter-legacy;
        proxy_read_timeout 30s;
    }

    location /ppap/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass http://ppap-current-api:8080/;
        proxy_read_timeout 1000s;
        proxy_send_timeout 1000s;
    }

    location /addon {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass http://ppap-current-web:4173;
        proxy_read_timeout 1000s;
    }

    location @current {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_pass http://ppap-current-web:4173;
        proxy_read_timeout 1000s;
    }

    location / {
        error_page 418 = @current;
        if ($ppap_edition = current) {
            return 418;
        }
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://web-base.ppap-test.svc.cluster.local:80;
        proxy_read_timeout 1000s;
    }
}
