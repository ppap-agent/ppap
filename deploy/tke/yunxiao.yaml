concurrencyConfig:
  maxRunningPipelineInstances: 3
  pipelineMaxRunningBehavior: rejectNew
  maxRunningJobInstances: 3
defaultWorkspace: current_repo
sources:
  current_repo:
    type: codeup
    name: PPAP current release source
    endpoint: https://codeup.aliyun.com/icoastline/integration/4.0/ppap-web.git
    branch: codex/ppap-current-release
    triggerEvents: []
    certificate:
      type: serviceConnection
      serviceConnection: dhoheqfj7wrmhhxg
stages:
  build:
    name: Build tested PPAP source and push private TCR images
    jobs:
      release_images:
        name: Build three images only
        runsOn:
          group: public/cn-hongkong
          container: build-steps-public-registry.cn-beijing.cr.aliyuncs.com/build-steps/alinux3:latest
        steps:
          preflight:
            name: Check exact source and canonical build graph
            step: Command
            with:
              run: |
                set -eu
                export PPAP_BUILD_SHA="${PPAP_SOURCE_SHA:-$(git rev-parse HEAD)}"
                export PPAP_IMAGE_PREFIX=icoastline.tencentcloudcr.com/ppap-feishu/current-
                git cat-file -e "$PPAP_BUILD_SHA^{commit}" || git fetch origin "$PPAP_BUILD_SHA"
                git checkout --detach "$PPAP_BUILD_SHA"
                test "$(git rev-parse HEAD)" = "$PPAP_BUILD_SHA"
                test "$(uname -m)" = x86_64
                docker info --format 'Docker Engine server: {{.ServerVersion}}'
                docker buildx version
                docker buildx bake release --set '*.platform=linux/amd64' --print > /tmp/ppap-current-bake.json
                python3 - <<'PY'
                import json, os
                graph = json.load(open('/tmp/ppap-current-bake.json'))
                assert set(graph['group']['release']['targets']) == {'app', 'web', 'deep'}
                for component in ('app', 'web', 'deep'):
                    target = graph['target'][component]
                    assert target['platforms'] == ['linux/amd64']
                    assert target['tags'] == [os.environ['PPAP_IMAGE_PREFIX'] + component + ':' + os.environ['PPAP_BUILD_SHA']]
                # Deep is the application from the same Dockerfile and source, one graph.
                for component, stage in (('app', 'app'), ('deep', 'deep')):
                    assert graph['target'][component]['dockerfile'] == 'deploy/app/Dockerfile'
                    assert graph['target'][component]['target'] == stage
                assert graph['target']['deep']['args']['PPAP_APP_BASE'] == 'deep-base'
                print('Exact source, all three targets and the shared app/Deep graph verified')
                PY
          tcr_login:
            name: Login existing TCR registry
            step: DockerLogin
            with:
              dockerRepository: icoastline.tencentcloudcr.com
              serviceConnection: wrd9tunqmazf1pk5
          build_push:
            name: Build and push fixed source
            step: Command
            with:
              run: |
                set -eu
                export PPAP_BUILD_SHA="$(git rev-parse HEAD)"
                export PPAP_IMAGE_PREFIX=icoastline.tencentcloudcr.com/ppap-feishu/current-
                test "$(git rev-parse HEAD)" = "$PPAP_BUILD_SHA"
                git diff --exit-code
                # The base levels (system, deps, deep-base; deploy/tke/bases.py) are built only in "bases"
                # mode, each tagged by the digest of its inputs. Releases build source layers on the recorded
                # images, so a missed layer cache can no longer re-push hundreds of MB from Hong Kong.
                if [ "${PPAP_BUILD_MODE:-release}" = bases ]; then
                  python3 deploy/tke/bases.py build
                  echo "PPAP_BASE_SOURCE $PPAP_BUILD_SHA"
                  exit 0
                fi
                # A release stacks on the recorded images, and only on images built from these exact inputs.
                base_args="$(python3 deploy/tke/bases.py release-args)"
                # Flow public runners reject docker-container startup; use their native inline cache.
                # JSON tag overrides also work on the runner's older Buildx (no tags+=).
                python3 - <<'PY'
                import json, os
                # Named contexts change only base-image transport. Keep the
                # Dockerfile versions/digests and the Deep -> Worker target edge.
                # Bases are pinned by digest in the Dockerfiles, so a mirror can never move them under the cache.
                python = 'python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df'
                node = 'node:22.22.0-bookworm-slim@sha256:dd9d21971ec4395903fa6143c2b9267d048ae01ca6d3ea96f16cb30df6187d94'
                bases = {
                    'app': [python, node],
                    'web': ['node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a', 'nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10'],
                    'deep': [python, node],
                }
                targets = {
                    component: {
                        'tags': [os.environ['PPAP_IMAGE_PREFIX'] + component + ':' + tag for tag in (os.environ['PPAP_BUILD_SHA'], 'build-cache')],
                        'contexts': {base: 'docker-image://docker.m.daocloud.io/library/' + base for base in bases[component]},
                    }
                    for component in ('app', 'web', 'deep')
                }
                with open('/tmp/ppap-current-cache.json', 'w') as output:
                    json.dump({'target': targets}, output)
                PY
                set -- --set '*.platform=linux/amd64' --set '*.cache-to=type=inline'
                for component in app web deep; do
                  set -- "$@" --set "$component.cache-from=type=registry,ref=${PPAP_IMAGE_PREFIX}${component}:build-cache"
                done
                # shellcheck disable=SC2086 # three "--set target.args.PPAP_APP_BASE=<image>" pairs
                set -- "$@" $base_args
                # The base-image mirror and the registry are reached over the network from the Hong Kong
                # runner; a dropped connection fails the whole bake. Finished steps are cached, so a retry
                # repeats only what had not finished.
                attempt=1
                until docker buildx bake -f docker-bake.hcl -f /tmp/ppap-current-cache.json release "$@" \
                  --provenance=false --metadata-file /tmp/ppap-current-images.json --push; do
                  test "$attempt" -lt 3
                  attempt=$((attempt + 1))
                  sleep 20
                done
                python3 - <<'PY'
                import json, os, re
                metadata = json.load(open('/tmp/ppap-current-images.json'))
                for component in ('app', 'web', 'deep'):
                    digest = metadata[component]['containerimage.digest']
                    assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
                    print('PPAP_RELEASE_IMAGE ' + component + ' ' + os.environ['PPAP_IMAGE_PREFIX'] + component + '@' + digest)
                print('PPAP_RELEASE_SOURCE ' + os.environ['PPAP_BUILD_SHA'])
                PY
