            - name: PPAP_MODEL_VISION_MODEL
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_MODEL_VISION_MODEL
            - name: PPAP_MODEL_VISION_EXTRA_BODY_JSON
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_MODEL_VISION_EXTRA_BODY_JSON
            - name: PPAP_PG_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_PG_WORKER_PASSWORD
            - name: PPAP_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_S3_ACCESS_KEY
            - name: PPAP_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_S3_SECRET_KEY
            # The trusted Controller holds the platform text and vision keys for checker
            # trials; guests receive only a local grant.
            - name: PPAP_MODEL_TEXT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current-text-model-v1
                  key: PPAP_MODEL_TEXT_API_KEY
            - name: PPAP_MODEL_VISION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_MODEL_VISION_API_KEY
            - name: PPAP_MODEL_TEXT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ppap-current
                  key: PPAP_MODEL_TEXT_BASE_URL
            - name: PPAP_MODEL_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_MODEL_CREDENTIAL_ENCRYPTION_KEY
                  optional: true
            - name: PPAP_SERVICE
              value: deep
          volumeMounts:
            - name: deep-sock
              mountPath: /run/ppap-deep
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["python", "-m", "agent.readiness"]
            periodSeconds: 5
            timeoutSeconds: 3
        - name: worker
          image: icoastline.tencentcloudcr.com/ppap-feishu/current-worker@sha256:5d23c0315d2f2f4bbdfc8f15c5a936b9be3c6a1286f72688c4042ac31abef4ac
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ppap-current
          env:
            - name: PPAP_MODEL_VISION_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_MODEL_VISION_BASE_URL
            - name: PPAP_MODEL_VISION_MODEL
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_MODEL_VISION_MODEL
            - name: PPAP_MODEL_VISION_EXTRA_BODY_JSON
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_MODEL_VISION_EXTRA_BODY_JSON
            - name: PPAP_MODEL_VISION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_MODEL_VISION_API_KEY
            - name: PPAP_PG_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_PG_WORKER_PASSWORD
            - name: PPAP_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_S3_ACCESS_KEY
            - name: PPAP_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_S3_SECRET_KEY
            - name: PPAP_MODEL_TEXT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current-text-model-v1
                  key: PPAP_MODEL_TEXT_API_KEY
            - name: PPAP_MODEL_TEXT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ppap-current
                  key: PPAP_MODEL_TEXT_BASE_URL
            - name: FEISHU_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: FEISHU_APP_SECRET
            - name: PPAP_MODEL_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_MODEL_CREDENTIAL_ENCRYPTION_KEY
                  optional: true
            - name: PPAP_SERVICE
              value: worker
          command: ["sh", "-c"]
          args:
            - |
              i=0
              until [ -S "$PPAP_DEEP_CONTROLLER_SOCKET" ]; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "warning: deep controller socket unavailable after 60s; starting Worker so Standard remains available" >&2
                  break
                fi
                sleep 1
              done
              exec python -m worker.main
          volumeMounts:
            - name: deep-sock
              mountPath: /run/ppap-deep
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
