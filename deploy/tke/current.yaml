apiVersion: batch/v1
kind: Job
metadata:
  name: ppap-current-init-db
  namespace: ppap-test
  labels:
    k8s-app: ppap-current
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        k8s-app: ppap-current-init-db
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: docker.m.daocloud.io/library/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ppap-current
            - secretRef:
                name: ppap-current
          env:
            - name: PGHOST
              value: ppap-current-postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: ppap-current
                  key: PPAP_PG_BOOTSTRAP_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_PG_BOOTSTRAP_PASSWORD
            - name: PGCONNECT_TIMEOUT
              value: "5"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              i=0
              while true; do
                if psql -d postgres -v ON_ERROR_STOP=1 -f /migrations/bootstrap.sql \
                  && sh /migrations/apply.sh; then
                  break
                fi
                i=$((i + 1))
                if [ "$i" -ge 30 ]; then
                  echo "init-db: postgres did not accept bootstrap/apply" >&2
                  exit 1
                fi
                sleep 2
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: migrations
          configMap:
            name: ppap-current-migrations
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ppap-current-init-bucket
  namespace: ppap-test
  labels:
    k8s-app: ppap-current
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        k8s-app: ppap-current-init-bucket
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: init-bucket
          image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ppap-current
          env:
            - name: PPAP_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_S3_ACCESS_KEY
            - name: PPAP_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_S3_SECRET_KEY
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              i=0
              until curl -fsS --max-time 2 "$PPAP_S3_ENDPOINT/minio/health/live" >/dev/null; do
                i=$((i + 1))
                if [ "$i" -ge 30 ]; then exit 1; fi
                sleep 2
              done
              mcli alias set ppap "$PPAP_S3_ENDPOINT" "$PPAP_S3_ACCESS_KEY" "$PPAP_S3_SECRET_KEY"
              mcli mb --ignore-existing "ppap/$PPAP_S3_BUCKET"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
