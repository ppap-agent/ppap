apiVersion: v1
kind: ConfigMap
metadata:
  name: ppap-current
  namespace: ppap-test
  labels:
    k8s-app: ppap-current
data:
  PPAP_PROFILE: production
  PPAP_BUILD_SHA: 405a9a35564aac7500c27e3b7b82fd3eb2233803
  PPAP_WEB_URL: https://ppap.icoastline.com
  PPAP_PUBLIC_API_URL: https://ppap.icoastline.com/ppap
  PPAP_PG_HOST: ppap-current-postgres
  PPAP_PG_PORT: "5432"
  PPAP_PG_DATABASE: ppap
  PPAP_PG_BOOTSTRAP_USER: ppap
  PPAP_PG_MIGRATOR_USER: ppap_migrator
  PPAP_PG_API_USER: ppap_api
  PPAP_PG_WORKER_USER: ppap_worker
  PPAP_S3_ENDPOINT: http://ppap-current-silo:9000
  PPAP_S3_REGION: us-east-1
  PPAP_S3_BUCKET: ppap-objects
  LLM_MODEL: grok-4.6
  FEISHU_APP_ID: cli_a961a27719b81cc9
  FEISHU_AI_ITEM_ID: OpenApp_Lcoastline_PPAPAuditAgent
  FEISHU_FREE_TRIAL_QUOTA_POINTS: "10000"
  PPAP_CURRENT_TENANT_ALLOWLIST: 2caeb428f08e175d,16e7179eb1abd75d,16fad24b7282175e,175b8362d5ce575f
  PPAP_USAGE_CHARGE_ENABLED: "false"
  PPAP_DEEP_CUSTOMER_ENABLED: "true"
  PPAP_DEEP_CONTROLLER_SOCKET: /run/ppap-deep/controller.sock
  PPAP_DEEP_EXECUTOR_REVISION: ppap-deep-v1
  PPAP_DEEP_RUNTIME: process
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  OCR_ADAPTER_MODE: auto
  OCR_ENGINE: easyocr
  OCR_LANGUAGES: ch_sim,en
---
