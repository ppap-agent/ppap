        - name: worker
          image: icoastline.tencentcloudcr.com/ppap-feishu/current-worker@sha256:f32140a7f3844af60c1e3964c6115387fdd7d72cf238d7197fe3aad8b808351a
          imagePullPolicy: IfNotPresent
          envFrom:
