              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_S3_ACCESS_KEY
            - name: PPAP_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ppap-current
                  key: PPAP_S3_SECRET_KEY
