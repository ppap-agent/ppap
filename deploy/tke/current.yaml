apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppap-current-worker
  namespace: ppap-test
  labels:
    k8s-app: ppap-current-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: ppap-current-worker
  template:
    metadata:
      labels:
        k8s-app: ppap-current-worker
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: deep-sock
          emptyDir: {}
      containers:
        - name: deep
          image: unregistry.xixifusi.online/ppap-worker:405a9a35564aac7500c27e3b7b82fd3eb2233803
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ppap-current
            - secretRef:
                name: ppap-current
          env:
            - name: PPAP_SERVICE
              value: deep
          volumeMounts:
            - name: deep-sock
              mountPath: /run/ppap-deep
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
        - name: worker
          image: unregistry.xixifusi.online/ppap-worker:405a9a35564aac7500c27e3b7b82fd3eb2233803
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ppap-current
            - secretRef:
                name: ppap-current
          env:
            - name: PPAP_SERVICE
              value: worker
          command: ["sh", "-c"]
          args:
            - |
              i=0
              until [ -S "$PPAP_DEEP_CONTROLLER_SOCKET" ]; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "deep controller socket missing" >&2
                  exit 1
                fi
                sleep 1
              done
              exec python -m ppap_worker.main
          volumeMounts:
            - name: deep-sock
              mountPath: /run/ppap-deep
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
