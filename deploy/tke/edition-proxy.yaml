apiVersion: apps/v1
kind: Deployment
metadata:
  name: edition-proxy
  namespace: ppap-test
  labels:
    k8s-app: edition-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: edition-proxy
  template:
    metadata:
      labels:
        k8s-app: edition-proxy
    spec:
      containers:
        - name: nginx
          image: docker.m.daocloud.io/library/nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: conf
          configMap:
            name: edition-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: edition-proxy
  namespace: ppap-test
  labels:
    k8s-app: edition-proxy
spec:
  type: NodePort
  selector:
    k8s-app: edition-proxy
  ports:
    - name: http
      port: 80
      targetPort: 80
