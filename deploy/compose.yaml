services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: ${PPAP_PG_BOOTSTRAP_USER}
      POSTGRES_PASSWORD: ${PPAP_PG_BOOTSTRAP_PASSWORD}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: ppap-minio:verify
    build:
      context: minio
      dockerfile: Dockerfile
    command: ["minio", "server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${PPAP_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${PPAP_S3_SECRET_KEY}

  init:
    image: ppap-api:${PPAP_BUILD_SHA}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PPAP_PROFILE: production
      PPAP_BUILD_SHA: ${PPAP_BUILD_SHA}
      PPAP_PG_HOST: postgres
      PPAP_PG_PORT: "5432"
      PPAP_PG_DATABASE: ${PPAP_PG_DATABASE}
      PPAP_PG_BOOTSTRAP_USER: ${PPAP_PG_BOOTSTRAP_USER}
      PPAP_PG_BOOTSTRAP_PASSWORD: ${PPAP_PG_BOOTSTRAP_PASSWORD}
      PPAP_PG_MIGRATOR_USER: ${PPAP_PG_MIGRATOR_USER}
      PPAP_PG_MIGRATOR_PASSWORD: ${PPAP_PG_MIGRATOR_PASSWORD}
      PPAP_PG_API_USER: ${PPAP_PG_API_USER}
      PPAP_PG_API_PASSWORD: ${PPAP_PG_API_PASSWORD}
      PPAP_PG_WORKER_USER: ${PPAP_PG_WORKER_USER}
      PPAP_PG_WORKER_PASSWORD: ${PPAP_PG_WORKER_PASSWORD}
      PPAP_S3_ENDPOINT: ${PPAP_S3_ENDPOINT}
      PPAP_S3_REGION: ${PPAP_S3_REGION}
      PPAP_S3_BUCKET: ${PPAP_S3_BUCKET}
      PPAP_S3_ACCESS_KEY: ${PPAP_S3_ACCESS_KEY}
      PPAP_S3_SECRET_KEY: ${PPAP_S3_SECRET_KEY}
      PPAP_WEB_URL: ${PPAP_WEB_URL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY:-}
    command:
      - sh
      - -c
      - python tools/dev.py provision

  api:
    image: ppap-api:${PPAP_BUILD_SHA}
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      PPAP_PROFILE: production
      PPAP_BUILD_SHA: ${PPAP_BUILD_SHA}
      PPAP_SERVICE: api
      PPAP_PG_HOST: postgres
      PPAP_PG_PORT: "5432"
      PPAP_PG_DATABASE: ${PPAP_PG_DATABASE}
      PPAP_PG_API_USER: ${PPAP_PG_API_USER}
      PPAP_PG_API_PASSWORD: ${PPAP_PG_API_PASSWORD}
      PPAP_S3_ENDPOINT: ${PPAP_S3_ENDPOINT}
      PPAP_S3_REGION: ${PPAP_S3_REGION}
      PPAP_S3_BUCKET: ${PPAP_S3_BUCKET}
      PPAP_S3_ACCESS_KEY: ${PPAP_S3_ACCESS_KEY}
      PPAP_S3_SECRET_KEY: ${PPAP_S3_SECRET_KEY}
      PPAP_WEB_URL: ${PPAP_WEB_URL}
      PPAP_PUBLIC_API_URL: ${PPAP_PUBLIC_API_URL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    image: ppap-worker:${PPAP_BUILD_SHA}
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      PPAP_PROFILE: production
      PPAP_BUILD_SHA: ${PPAP_BUILD_SHA}
      PPAP_SERVICE: worker
      PPAP_PG_HOST: postgres
      PPAP_PG_PORT: "5432"
      PPAP_PG_DATABASE: ${PPAP_PG_DATABASE}
      PPAP_PG_WORKER_USER: ${PPAP_PG_WORKER_USER}
      PPAP_PG_WORKER_PASSWORD: ${PPAP_PG_WORKER_PASSWORD}
      PPAP_S3_ENDPOINT: ${PPAP_S3_ENDPOINT}
      PPAP_S3_REGION: ${PPAP_S3_REGION}
      PPAP_S3_BUCKET: ${PPAP_S3_BUCKET}
      PPAP_S3_ACCESS_KEY: ${PPAP_S3_ACCESS_KEY}
      PPAP_S3_SECRET_KEY: ${PPAP_S3_SECRET_KEY}
      PPAP_WEB_URL: ${PPAP_WEB_URL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY:-}

  web:
    image: ppap-web:${PPAP_BUILD_SHA}
    depends_on:
      api:
        condition: service_started
    environment:
      PPAP_BUILD_SHA: ${PPAP_BUILD_SHA}
      PPAP_PUBLIC_API_URL: ${PPAP_PUBLIC_API_URL}
      PPAP_WEB_BIND: 0.0.0.0
      PPAP_WEB_PORT: "4173"
    ports:
      - "127.0.0.1:4173:4173"
