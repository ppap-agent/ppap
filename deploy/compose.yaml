volumes:
  silo-data:

services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: ${PPAP_PG_BOOTSTRAP_USER}
      POSTGRES_PASSWORD: ${PPAP_PG_BOOTSTRAP_PASSWORD}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER && [ \"$$(cat /proc/1/comm)\" = postgres ]"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${PPAP_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${PPAP_S3_SECRET_KEY}
    volumes:
      - silo-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  init-db:
    image: postgres:16.10-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: ${PPAP_PG_HOST}
      PGPORT: "${PPAP_PG_PORT}"
      PGUSER: ${PPAP_PG_BOOTSTRAP_USER}
      PGPASSWORD: ${PPAP_PG_BOOTSTRAP_PASSWORD}
      PPAP_PG_DATABASE: ${PPAP_PG_DATABASE}
      PPAP_PG_MIGRATOR_USER: ${PPAP_PG_MIGRATOR_USER}
      PPAP_PG_MIGRATOR_PASSWORD: ${PPAP_PG_MIGRATOR_PASSWORD}
      PPAP_PG_API_USER: ${PPAP_PG_API_USER}
      PPAP_PG_API_PASSWORD: ${PPAP_PG_API_PASSWORD}
      PPAP_PG_WORKER_USER: ${PPAP_PG_WORKER_USER}
      PPAP_PG_WORKER_PASSWORD: ${PPAP_PG_WORKER_PASSWORD}
      PGCONNECT_TIMEOUT: "5"
    volumes:
      - ../migrations:/migrations:ro
      - silo-data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        i=0
        while true; do
          if psql -d postgres -v ON_ERROR_STOP=1 -f /migrations/bootstrap.sql \
            && sh /migrations/apply.sh; then
            break
          fi
          i=$$((i+1))
          if [ "$$i" -ge 30 ]; then
            echo "init-db: postgres did not accept bootstrap/apply" >&2
            exit 1
          fi
          sleep 2
        done

  init-bucket:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    depends_on:
      silo:
        condition: service_healthy
    environment:
      PPAP_S3_ENDPOINT: ${PPAP_S3_ENDPOINT}
      PPAP_S3_ACCESS_KEY: ${PPAP_S3_ACCESS_KEY}
      PPAP_S3_SECRET_KEY: ${PPAP_S3_SECRET_KEY}
      PPAP_S3_BUCKET: ${PPAP_S3_BUCKET}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        i=0
        until curl -fsS --max-time 2 "$$PPAP_S3_ENDPOINT/minio/health/live" >/dev/null; do
          i=$$((i+1))
          if [ "$$i" -ge 30 ]; then exit 1; fi
          sleep 1
        done
        mcli alias set ppap "$$PPAP_S3_ENDPOINT" "$$PPAP_S3_ACCESS_KEY" "$$PPAP_S3_SECRET_KEY"
        mcli mb --ignore-existing "ppap/$$PPAP_S3_BUCKET"

  api:
    image: ppap-api:${PPAP_BUILD_SHA}
    depends_on:
      init-db:
        condition: service_completed_successfully
      init-bucket:
        condition: service_completed_successfully
    environment:
      PPAP_PROFILE: production
      PPAP_BUILD_SHA: ${PPAP_BUILD_SHA}
      PPAP_SERVICE: api
      PPAP_PG_HOST: ${PPAP_PG_HOST}
      PPAP_PG_PORT: "${PPAP_PG_PORT}"
      PPAP_PG_DATABASE: ${PPAP_PG_DATABASE}
      PPAP_PG_API_USER: ${PPAP_PG_API_USER}
      PPAP_PG_API_PASSWORD: ${PPAP_PG_API_PASSWORD}
      PPAP_S3_ENDPOINT: ${PPAP_S3_ENDPOINT}
      PPAP_S3_REGION: ${PPAP_S3_REGION}
      PPAP_S3_BUCKET: ${PPAP_S3_BUCKET}
      PPAP_S3_ACCESS_KEY: ${PPAP_S3_ACCESS_KEY}
      PPAP_S3_SECRET_KEY: ${PPAP_S3_SECRET_KEY}
      PPAP_WEB_URL: ${PPAP_WEB_URL}
      PPAP_PUBLIC_API_URL: ${PPAP_PUBLIC_API_URL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      PPAP_MODEL_CREDENTIAL_ENCRYPTION_KEY: ${PPAP_MODEL_CREDENTIAL_ENCRYPTION_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PPAP_DEEP_LLM_BASE_URL: ${PPAP_DEEP_LLM_BASE_URL:-}
      PPAP_DEEP_LLM_MODEL: ${PPAP_DEEP_LLM_MODEL:-}
      PPAP_DEEP_REASONING_EFFORT: ${PPAP_DEEP_REASONING_EFFORT:-medium}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      # Acceptance and execution must identify the same non-secret tool policy.
      OCR_OPENAI_BASE_URL: ${OCR_OPENAI_BASE_URL:-}
      OCR_MODEL_NAME: ${OCR_MODEL_NAME:-}
      OCR_OPENAI_EXTRA_BODY_JSON: ${OCR_OPENAI_EXTRA_BODY_JSON:-}
      PADDLE_OCR_URL: ${PADDLE_OCR_URL:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      PPAP_FEISHU_NOTIFICATIONS_ENABLED: ${PPAP_FEISHU_NOTIFICATIONS_ENABLED:-false}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_AI_ITEM_ID: ${FEISHU_AI_ITEM_ID:-}
      FEISHU_FREE_TRIAL_QUOTA_POINTS: ${FEISHU_FREE_TRIAL_QUOTA_POINTS:-10000}
      PPAP_PARTNER_AI_ENDPOINT: ${PPAP_PARTNER_AI_ENDPOINT:-}
      PPAP_DEEP_CONTROLLER_SOCKET: ${PPAP_DEEP_CONTROLLER_SOCKET:-}
      PPAP_DEEP_EXECUTOR_REVISION: ${PPAP_DEEP_EXECUTOR_REVISION:-}
      PPAP_DEEP_SANDBOX_PROFILE: ${PPAP_DEEP_SANDBOX_PROFILE:-off}
      PPAP_CURRENT_TENANT_ALLOWLIST: ${PPAP_CURRENT_TENANT_ALLOWLIST:-}
      PPAP_USAGE_CHARGE_ENABLED: ${PPAP_USAGE_CHARGE_ENABLED:-true}
      PPAP_SUPPORT_PHONE: ${PPAP_SUPPORT_PHONE:-}
      PPAP_SUPPORT_EMAIL: ${PPAP_SUPPORT_EMAIL:-}
      PPAP_SUPPORT_SERVICE_HOURS: ${PPAP_SUPPORT_SERVICE_HOURS:-}
      PPAP_SUPPORT_QR_FILE: ${PPAP_SUPPORT_QR_FILE:-}
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:${PPAP_API_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    image: ppap-worker:${PPAP_BUILD_SHA}
    depends_on:
      init-db:
        condition: service_completed_successfully
      init-bucket:
        condition: service_completed_successfully
    environment:
      PPAP_PROFILE: production
      PPAP_BUILD_SHA: ${PPAP_BUILD_SHA}
      PPAP_SERVICE: worker
      PPAP_PG_HOST: ${PPAP_PG_HOST}
      PPAP_PG_PORT: "${PPAP_PG_PORT}"
      PPAP_PG_DATABASE: ${PPAP_PG_DATABASE}
      PPAP_PG_WORKER_USER: ${PPAP_PG_WORKER_USER}
      PPAP_PG_WORKER_PASSWORD: ${PPAP_PG_WORKER_PASSWORD}
      PPAP_S3_ENDPOINT: ${PPAP_S3_ENDPOINT}
      PPAP_S3_REGION: ${PPAP_S3_REGION}
      PPAP_S3_BUCKET: ${PPAP_S3_BUCKET}
      PPAP_S3_ACCESS_KEY: ${PPAP_S3_ACCESS_KEY}
      PPAP_S3_SECRET_KEY: ${PPAP_S3_SECRET_KEY}
      PPAP_WEB_URL: ${PPAP_WEB_URL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      PPAP_MODEL_CREDENTIAL_ENCRYPTION_KEY: ${PPAP_MODEL_CREDENTIAL_ENCRYPTION_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PPAP_DEEP_LLM_BASE_URL: ${PPAP_DEEP_LLM_BASE_URL:-}
      PPAP_DEEP_LLM_MODEL: ${PPAP_DEEP_LLM_MODEL:-}
      PPAP_DEEP_REASONING_EFFORT: ${PPAP_DEEP_REASONING_EFFORT:-medium}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OCR_OPENAI_API_KEY: ${OCR_OPENAI_API_KEY:-}
      OCR_OPENAI_BASE_URL: ${OCR_OPENAI_BASE_URL:-}
      OCR_MODEL_NAME: ${OCR_MODEL_NAME:-}
      OCR_OPENAI_EXTRA_BODY_JSON: ${OCR_OPENAI_EXTRA_BODY_JSON:-}
      PADDLE_OCR_URL: ${PADDLE_OCR_URL:-}
      PADDLE_TOKEN: ${PADDLE_TOKEN:-}
      PPAP_DEEP_CONTROLLER_SOCKET: ${PPAP_DEEP_CONTROLLER_SOCKET:-}
      PPAP_DEEP_EXECUTOR_REVISION: ${PPAP_DEEP_EXECUTOR_REVISION:-}
      PPAP_DEEP_SANDBOX_PROFILE: ${PPAP_DEEP_SANDBOX_PROFILE:-off}
      LOG_FORMAT: json
      LOG_LEVEL: INFO

  web:
    image: ppap-web:${PPAP_BUILD_SHA}
    depends_on:
      api:
        condition: service_healthy
    environment:
      PPAP_BUILD_SHA: ${PPAP_BUILD_SHA}
      PPAP_PUBLIC_API_URL: ${PPAP_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:${PPAP_WEB_HOST_PORT:-4173}:4173"
