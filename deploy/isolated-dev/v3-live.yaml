# Explicit paid acceptance only. Never join the remote-dev/production network.
x-provider: &provider
  LLM_API_KEY: ${LLM_API_KEY:?set a real provider credential}
  LLM_BASE_URL: ${LLM_BASE_URL:?set the real provider endpoint}
  LLM_MODEL: ${LLM_MODEL:?set the real provider model}
  OPENAI_API_KEY: ${LLM_API_KEY}
  OPENAI_BASE_URL: ${LLM_BASE_URL}
  MODEL_NAME: ${LLM_MODEL}
  OCR_OPENAI_API_KEY: ${OCR_OPENAI_API_KEY:-}
  OCR_OPENAI_BASE_URL: ${OCR_OPENAI_BASE_URL:-}
  OCR_MODEL_NAME: ${OCR_MODEL_NAME:-}
  PADDLE_OCR_URL: ${PADDLE_OCR_URL:-}
  PADDLE_TOKEN: ${PADDLE_TOKEN:-}
  FEISHU_APP_ID: ""
  FEISHU_APP_SECRET: ""
  PPAP_FEISHU_NOTIFICATIONS_ENABLED: "false"
  PPAP_USAGE_CHARGE_ENABLED: "false"

services:
  api:
    environment: *provider
  worker:
    environment: *provider
