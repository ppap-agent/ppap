volumes:
  silo-data:

services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: ppap
      POSTGRES_PASSWORD: ppap_isolated_dev
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      - ../../migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppap"]
      interval: 2s
      timeout: 5s
      retries: 20

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ppap_isolated_dev
      MINIO_ROOT_PASSWORD: ppap_isolated_dev
    volumes:
      - silo-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  init-db:
    image: postgres:16.10-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ppap
      PGPASSWORD: ppap_isolated_dev
      PPAP_PG_DATABASE: ppap
      PPAP_PG_MIGRATOR_USER: ppap_migrator
      PPAP_PG_MIGRATOR_PASSWORD: ppap_isolated_dev
      PPAP_PG_API_USER: ppap_api
      PPAP_PG_API_PASSWORD: ppap_isolated_dev
      PPAP_PG_WORKER_USER: ppap_worker
      PPAP_PG_WORKER_PASSWORD: ppap_isolated_dev
    volumes:
      - ../../migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        psql -d postgres -v ON_ERROR_STOP=1 -f /migrations/bootstrap.sql
        PGUSER="$$PPAP_PG_MIGRATOR_USER" PGPASSWORD="$$PPAP_PG_MIGRATOR_PASSWORD" \
          psql -d "$$PPAP_PG_DATABASE" -v ON_ERROR_STOP=1 -f /migrations/apply.sql

  init-bucket:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    depends_on:
      silo:
        condition: service_started
    environment:
      PPAP_S3_ENDPOINT: http://silo:9000
      PPAP_S3_ACCESS_KEY: ppap_isolated_dev
      PPAP_S3_SECRET_KEY: ppap_isolated_dev
      PPAP_S3_BUCKET: ppap-objects
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        i=0
        until mcli alias set ppap "$$PPAP_S3_ENDPOINT" "$$PPAP_S3_ACCESS_KEY" "$$PPAP_S3_SECRET_KEY"; do
          i=$$((i+1))
          if [ "$$i" -ge 30 ]; then exit 1; fi
          sleep 1
        done
        mcli mb --ignore-existing "ppap/$$PPAP_S3_BUCKET"

  api:
    image: ppap-api:${PPAP_BUILD_SHA:-local}
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
      args:
        PPAP_BUILD_SHA: ${PPAP_BUILD_SHA:-local}
        PPAP_SERVICE: api
    depends_on:
      init-db:
        condition: service_completed_successfully
      init-bucket:
        condition: service_completed_successfully
    environment:
      PPAP_PROFILE: isolated-dev
      PPAP_BUILD_SHA: ${PPAP_BUILD_SHA:-local}
      PPAP_SERVICE: api
      PPAP_PG_HOST: postgres
      PPAP_PG_PORT: "5432"
      PPAP_PG_DATABASE: ppap
      PPAP_PG_API_USER: ppap_api
      PPAP_PG_API_PASSWORD: ppap_isolated_dev
      PPAP_S3_ENDPOINT: http://silo:9000
      PPAP_S3_REGION: us-east-1
      PPAP_S3_BUCKET: ppap-objects
      PPAP_S3_ACCESS_KEY: ppap_isolated_dev
      PPAP_S3_SECRET_KEY: ppap_isolated_dev
      PPAP_WEB_URL: http://127.0.0.1:4173
      PPAP_PUBLIC_API_URL: http://127.0.0.1:8080
      LOG_FORMAT: text
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    image: ppap-worker:${PPAP_BUILD_SHA:-local}
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
      args:
        PPAP_BUILD_SHA: ${PPAP_BUILD_SHA:-local}
        PPAP_SERVICE: worker
    depends_on:
      init-db:
        condition: service_completed_successfully
      init-bucket:
        condition: service_completed_successfully
    environment:
      PPAP_PROFILE: isolated-dev
      PPAP_BUILD_SHA: ${PPAP_BUILD_SHA:-local}
      PPAP_SERVICE: worker
      PPAP_PG_HOST: postgres
      PPAP_PG_PORT: "5432"
      PPAP_PG_DATABASE: ppap
      PPAP_PG_WORKER_USER: ppap_worker
      PPAP_PG_WORKER_PASSWORD: ppap_isolated_dev
      PPAP_S3_ENDPOINT: http://silo:9000
      PPAP_S3_REGION: us-east-1
      PPAP_S3_BUCKET: ppap-objects
      PPAP_S3_ACCESS_KEY: ppap_isolated_dev
      PPAP_S3_SECRET_KEY: ppap_isolated_dev
      PPAP_WEB_URL: http://127.0.0.1:4173
      OCR_ADAPTER_MODE: auto
      LOG_FORMAT: text
      LOG_LEVEL: INFO

  web:
    image: ppap-web:${PPAP_BUILD_SHA:-local}
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
      args:
        PPAP_BUILD_SHA: ${PPAP_BUILD_SHA:-local}
    depends_on:
      api:
        condition: service_healthy
    environment:
      PPAP_BUILD_SHA: ${PPAP_BUILD_SHA:-local}
      PPAP_PUBLIC_API_URL: http://127.0.0.1:8080
    ports:
      - "127.0.0.1:4173:4173"
