# Shared Checker Core runtime for Standard and Deep audits. The dedicated
# image owns the Controller and low-privilege guest. API/Worker share only its
# project-scoped UDS volume, never a Docker socket or a guest execution path.

volumes:
  deep-socket:

services:
  api:
    depends_on:
      deep:
        condition: service_healthy
    environment:
      PPAP_DEEP_CONTROLLER_SOCKET: /run/ppap-deep/controller.sock
      PPAP_DEEP_EXECUTOR_REVISION: ppap-deep-v2
      PPAP_DEEP_SANDBOX_PROFILE: "off"
    volumes:
      - deep-socket:/run/ppap-deep

  worker:
    depends_on:
      deep:
        condition: service_healthy
    environment:
      PPAP_DEEP_CONTROLLER_SOCKET: /run/ppap-deep/controller.sock
      PPAP_DEEP_EXECUTOR_REVISION: ppap-deep-v2
      PPAP_DEEP_SANDBOX_PROFILE: "off"
    volumes:
      - deep-socket:/run/ppap-deep

  deep:
    image: ppap-deep:${PPAP_BUILD_SHA:?set PPAP_BUILD_SHA to the 40-character git SHA}
    depends_on:
      init-db:
        condition: service_completed_successfully
      init-bucket:
        condition: service_completed_successfully
    env_file:
      - path: ../../.env
        required: false
    environment:
      PPAP_PROFILE: isolated-dev
      PPAP_BUILD_SHA: ${PPAP_BUILD_SHA:?set PPAP_BUILD_SHA to the 40-character git SHA}
      PPAP_SERVICE: deep
      PPAP_DEEP_LLM_API_KEY: ""
      PPAP_PG_HOST: postgres
      PPAP_PG_PORT: "5432"
      PPAP_PG_DATABASE: ppap
      PPAP_PG_WORKER_USER: ppap_worker
      PPAP_PG_WORKER_PASSWORD: ppap_isolated_dev
      PPAP_S3_ENDPOINT: http://silo:9000
      PPAP_S3_REGION: us-east-1
      PPAP_S3_BUCKET: ppap-objects
      PPAP_S3_ACCESS_KEY: ppap_isolated_dev
      PPAP_S3_SECRET_KEY: ppap_isolated_dev
      PPAP_WEB_URL: http://127.0.0.1:4173
      PPAP_DEEP_CONTROLLER_SOCKET: /run/ppap-deep/controller.sock
      PPAP_DEEP_EXECUTOR_REVISION: ppap-deep-v2
      PPAP_DEEP_RUNTIME: container-only
      PPAP_DEEP_SANDBOX_PROFILE: "off"
    volumes:
      - deep-socket:/run/ppap-deep
    healthcheck:
      test: ["CMD", "python", "-m", "agent.readiness"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 2g
