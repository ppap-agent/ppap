# Standalone, manual-only acceptance. Never layer onto a live stack.
# Fresh credentials also prevent the model guest from guessing isolated-dev
# passwords. Only runner loopback ports; no ambient .env, Docker socket or external network.
x-product: &product
  PPAP_PROFILE: remote-dev
  PPAP_BUILD_SHA: ${PPAP_CHECKER_LIVE_RUNTIME_SHA:-${PPAP_BUILD_SHA:?candidate SHA required}}
  PPAP_PG_HOST: postgres
  PPAP_PG_DATABASE: ${LIVE_PG_DATABASE:-ppap}
  PPAP_PG_API_PASSWORD: ""
  PPAP_PG_WORKER_PASSWORD: ""
  PPAP_PG_MIGRATOR_PASSWORD: ""
  PPAP_PG_BOOTSTRAP_PASSWORD: ""
  PPAP_S3_ENDPOINT: http://silo:9000
  PPAP_S3_ACCESS_KEY: ${LIVE_S3_ACCESS_KEY:?}
  PPAP_S3_SECRET_KEY: ${LIVE_S3_SECRET_KEY:?}
  PPAP_S3_BUCKET: ${LIVE_S3_BUCKET:-checker-live}
  PPAP_WEB_URL: http://127.0.0.1:${LIVE_WEB_PORT:-14173}
  PPAP_PUBLIC_API_URL: http://127.0.0.1:${LIVE_API_PORT:-18080}
  PPAP_USAGE_CHARGE_ENABLED: "false"
  PPAP_FEISHU_NOTIFICATIONS_ENABLED: "false"
  FEISHU_APP_ID: checker-live
  PPAP_DEEP_CUSTOMER_ENABLED: "true"
  PPAP_MODEL_CREDENTIAL_ENCRYPTION_KEY: ${LIVE_ENCRYPTION_KEY:?}
  PPAP_PERSONAL_MODEL_ALLOWED_BASE_URLS: ${CI_LLM_BASE_URL:?}
  PPAP_PERSONAL_MODEL_MAX_REQUESTS: ${PPAP_PERSONAL_MODEL_MAX_REQUESTS:?}
  PPAP_PERSONAL_MODEL_MAX_INPUT_TOKENS: ${PPAP_PERSONAL_MODEL_MAX_INPUT_TOKENS:?}
  PPAP_PERSONAL_MODEL_MAX_OUTPUT_TOKENS: ${PPAP_PERSONAL_MODEL_MAX_OUTPUT_TOKENS:?}
  LLM_BASE_URL: ${CI_LLM_BASE_URL:?}
  LLM_MODEL: ${CI_LLM_MODEL:?}
  LLM_API_KEY: ""
  OPENAI_API_KEY: ""
  PPAP_DEEP_LLM_API_KEY: ""
  PPAP_DEEP_CONTROLLER_SOCKET: /run/ppap-deep/controller.sock
  PPAP_DEEP_EXECUTOR_REVISION: checker-live
  PPAP_DEEP_SANDBOX_PROFILE: "off"
  LOG_FORMAT: json
  LOG_LEVEL: WARNING

volumes:
  postgres-data:
  silo-data:
  deep-socket:
  checker-evidence:

services:
  postgres:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: ppap
      POSTGRES_PASSWORD: ${LIVE_PG_BOOTSTRAP_PASSWORD:?}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:${LIVE_PG_PORT:-15432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ppap"]
      interval: 2s
      timeout: 5s
      retries: 30
  init-db:
    image: postgres:16.10-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ppap
      PGPASSWORD: ${LIVE_PG_BOOTSTRAP_PASSWORD:?}
      PPAP_PG_DATABASE: ${LIVE_PG_DATABASE:-ppap}
      PPAP_PG_MIGRATOR_USER: ppap_migrator
      PPAP_PG_MIGRATOR_PASSWORD: ${LIVE_PG_MIGRATOR_PASSWORD:?}
      PPAP_PG_API_USER: ppap_api
      PPAP_PG_API_PASSWORD: ${LIVE_PG_API_PASSWORD:?}
      PPAP_PG_WORKER_USER: ppap_worker
      PPAP_PG_WORKER_PASSWORD: ${LIVE_PG_WORKER_PASSWORD:?}
    volumes:
      - ../../migrations:/migrations:ro
    entrypoint: [sh, -ec]
    command: ["psql -d postgres -v ON_ERROR_STOP=1 -f /migrations/bootstrap.sql && sh /migrations/apply.sh"]
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${LIVE_S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${LIVE_S3_SECRET_KEY:?}
    ports: ["127.0.0.1:${LIVE_S3_PORT:-19000}:9000"]
    volumes:
      - silo-data:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/live]
      interval: 2s
      timeout: 5s
      retries: 30
  init-bucket:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    depends_on:
      silo:
        condition: service_healthy
    environment:
      ACCESS: ${LIVE_S3_ACCESS_KEY:?}
      SECRET: ${LIVE_S3_SECRET_KEY:?}
      BUCKET: ${LIVE_S3_BUCKET:-checker-live}
    entrypoint: [sh, -ec]
    command: ['mcli alias set live http://silo:9000 "$$ACCESS" "$$SECRET" >/dev/null && mcli mb --ignore-existing "live/$$BUCKET"']
  api:
    ports: ["127.0.0.1:${LIVE_API_PORT:-18080}:8080"]
    image: ${LIVE_API_IMAGE:-ppap-api:${PPAP_BUILD_SHA:?}}
    depends_on:
      init-db:
        condition: service_completed_successfully
      init-bucket:
        condition: service_completed_successfully
      deep:
        condition: service_healthy
    environment:
      <<: *product
      PPAP_SERVICE: api
      PPAP_PG_API_PASSWORD: ${LIVE_PG_API_PASSWORD:?}
    volumes:
      - deep-socket:/run/ppap-deep
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 5s
      retries: 30
  worker:
    image: ${LIVE_WORKER_IMAGE:-ppap-worker:${PPAP_BUILD_SHA:?}}
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *product
      PPAP_SERVICE: worker
      PPAP_PG_WORKER_PASSWORD: ${LIVE_PG_WORKER_PASSWORD:?}
    volumes:
      - deep-socket:/run/ppap-deep
  deep:
    image: ${LIVE_DEEP_IMAGE:-ppap-deep:${PPAP_BUILD_SHA:?}}
    depends_on:
      init-db:
        condition: service_completed_successfully
      init-bucket:
        condition: service_completed_successfully
    environment:
      <<: *product
      PPAP_SERVICE: deep
      PPAP_PG_WORKER_PASSWORD: ${LIVE_PG_WORKER_PASSWORD:?}
      PPAP_DEEP_RUNTIME: container-only
      PPAP_CHECKER_LIVE_MODE: ${PPAP_CHECKER_LIVE_MODE:-workflow}
      PPAP_CHECKER_LIVE_LOCAL_ID: ${PPAP_CHECKER_LIVE_LOCAL_ID:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?}
      LIVE_GUEST_AS_MIB: ${LIVE_GUEST_AS_MIB:-}
    command: [python, /live/checker_controller.py]
    volumes:
      - deep-socket:/run/ppap-deep
      - ../../scripts/checker_live_controller.py:/live/checker_controller.py:ro
      - ${LIVE_EVIDENCE_SOURCE:-${PPAP_CHECKER_LIVE_OUTPUT:?}}:/evidence
    healthcheck:
      test: [CMD, python, -m, agent.readiness]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 2g
  web:
    image: ${LIVE_WEB_IMAGE:-ppap-web:${PPAP_BUILD_SHA:?}}
    depends_on:
      api:
        condition: service_healthy
    environment:
      PPAP_BUILD_SHA: ${PPAP_CHECKER_LIVE_RUNTIME_SHA:-${PPAP_BUILD_SHA:?}}
      PPAP_PUBLIC_API_URL: http://127.0.0.1:${LIVE_API_PORT:-18080}
    ports: ["127.0.0.1:${LIVE_WEB_PORT:-14173}:4173"]
