server {
    listen 4173;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location = /runtime-config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~ ^/(files|requirements|templates|usage|receipts|tasks)?/?$ {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }
    location ~ ^/tasks/[^/]+/?$ {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }
    location = /audit {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }
    location = /audit/ {
        return 301 /audit$is_args$args;
    }
    location = /addon {
        try_files /addon.html =404;
    }
    location = /addon/ {
        return 301 /addon$is_args$args;
    }
    # The add-on page runs in a frame inside Feishu; everything it loads stays under /addon.
    location = /addon/runtime-config.json {
        add_header Cache-Control "no-store";
        try_files /runtime-config.json =404;
    }
    location /addon/assets/ {
        alias /usr/share/nginx/html/assets/;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
