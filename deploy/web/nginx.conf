server {
    listen 4173;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location = /runtime-config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /audit-files {
        try_files /index.html =404;
    }
    location = /audit-files/ {
        return 301 /audit-files$is_args$args;
    }
    location ~ ^/(files|requirements|templates|usage)/?$ {
        add_header Cache-Control "no-store";
        try_files /audit.html =404;
    }
    location ~ ^/tasks/[^/]+/?$ {
        add_header Cache-Control "no-store";
        try_files /audit.html =404;
    }
    location = /audit {
        add_header Cache-Control "no-store";
        try_files /audit.html =404;
    }
    location = /audit/ {
        return 301 /audit$is_args$args;
    }
    location = /audit.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /__audit-native {
        add_header Cache-Control "no-store";
        try_files /audit.html =404;
    }
    location = /addon {
        try_files /addon.html =404;
    }
    location = /addon/ {
        return 301 /addon$is_args$args;
    }
    location = /rules {
        try_files /index.html =404;
    }
    location = /rules/ {
        return 301 /rules$is_args$args;
    }
    location = /dev {
        try_files /index.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
