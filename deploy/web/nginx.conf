server {
    listen 4173;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /audit-files {
        try_files /audit-files.html =404;
    }
    location = /audit-files/ {
        return 301 /audit-files$is_args$args;
    }
    location = /addon {
        try_files /addon.html =404;
    }
    location = /addon/ {
        return 301 /addon$is_args$args;
    }
    location = /usage {
        try_files /usage.html =404;
    }
    location = /usage/ {
        return 301 /usage$is_args$args;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
